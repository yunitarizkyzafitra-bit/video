<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasyakuran Dirosa Angkatan IX</title>
  
  <!-- Font Islami & Elegan -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    /* Background Panggung Utama */
    .stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('./background.jpg');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center; /* Tepat di tengah panggung */
    }

    /* Kartu Nama Digital (Menutupi Khusus Area Tengah Panggung) */
    .display-card {
      position: relative;
      z-index: 10;
      width: 68vw; /* Presisi menutupi area tengah, tidak menyentuh pilar emas */
      max-width: 950px;
      min-height: 480px;
      padding: 35px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      
      /* Glassmorphism Pekat agar Teks Panggung Belakang Tertutup Total */
      background: rgba(5, 18, 12, 0.94); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 3px solid #d4af37;
      border-radius: 28px;
      
      /* Glow Emas & Bayangan Mewah */
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.85),
        0 0 35px rgba(212, 175, 55, 0.4),
        inset 0 0 20px rgba(212, 175, 55, 0.2);

      /* Animasi Masuk */
      animation: fadeInSlide 0.8s ease-out forwards;
    }

    /* Header Tulisan Tasyakuran Dirosa */
    .glass-header {
      align-self: center;
      padding: 10px 40px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(212, 175, 55, 0.6);
      border-radius: 35px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.15);
      margin-bottom: 5px;
    }

    .glass-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      letter-spacing: 5px;
      color: #f3e5ab;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    /* Konten Utama Kartu Nama */
    .card-body {
      display: flex;
      align-items: center;
      gap: 35px;
    }

    /* Bingkai Foto Peserta */
    .photo-container {
      flex-shrink: 0;
      width: 170px;
      height: 220px;
      border-radius: 18px;
      border: 3px solid #d4af37;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
      background: #0d231a;
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Informasi Teks Peserta */
    .info-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .info-box .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #d4af37;
      font-weight: 600;
      margin-bottom: 2px;
    }

    /* 1. Nama Liqo */
    .info-box .value-liqo {
      font-size: 1.25rem;
      font-weight: 600;
      color: #e0e0e0;
    }

    /* 2. Nama Mudarissah */
    .info-box .value-mudarissah {
      font-size: 1.3rem;
      font-weight: 600;
      color: #f3e5ab;
    }

    /* 3. Nama Peserta */
    .info-box .value-peserta {
      font-family: 'Cinzel', serif;
      font-size: 2.6rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9), 0 0 18px rgba(255, 215, 0, 0.4);
      line-height: 1.15;
      margin-top: 3px;
    }

    /* Tombol Navigasi Kontrol */
    .controls-container {
      position: absolute;
      bottom: 25px;
      z-index: 10;
      display: flex;
      gap: 15px;
    }

    .btn-control {
      background: rgba(12, 30, 22, 0.9);
      border: 1.5px solid #d4af37;
      color: #fff;
      padding: 10px 28px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .btn-control:hover {
      background: #d4af37;
      color: #0d231a;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.7);
      transform: translateY(-2px);
    }

    /* Keyframes Animasi */
    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="stage-container">

    <!-- Card Pemanggilan Digital (Presisi Area Tengah Panggung) -->
    <div class="display-card" id="participantCard">
      
      <!-- Header Efek Kaca Glassmorphism -->
      <div class="glass-header">
        <h2>Tasyakuran Dirosa</h2>
      </div>

      <!-- Konten Utama Kartu Nama -->
      <div class="card-body">
        <!-- Bingkai Foto Peserta -->
        <div class="photo-container">
          <img id="photoDisplay" src="https://via.placeholder.com/170x220" alt="Foto Peserta">
        </div>

        <!-- Informasi Detail Teks -->
        <div class="info-container">
          
          <!-- Nama Liqo -->
          <div class="info-box">
            <div class="label">Kelompok / Liqo</div>
            <div class="value-liqo" id="liqoDisplay">Liqo Khadijah - Palu Selatan</div>
          </div>

          <!-- Nama Mudarissah -->
          <div class="info-box">
            <div class="label">Mudarissah</div>
            <div class="value-mudarissah" id="mudarissahDisplay">Ustadzah Nurhaliza, S.Pd.I.</div>
          </div>

          <!-- Nama Peserta -->
          <div class="info-box">
            <div class="label">Nama Peserta</div>
            <div class="value-peserta" id="pesertaDisplay">Fulanah Binti Fulan</div>
          </div>

        </div>
      </div>

    </div>

    <!-- Kontrol Tombol Navigasi -->
    <div class="controls-container">
      <button class="btn-control" onclick="prevParticipant()">‹ Prev</button>
      <button class="btn-control" onclick="togglePause()">Pause</button>
      <button class="btn-control" onclick="nextParticipant()">Next ›</button>
    </div>

  </div>

  <script>
    // Data Peserta (Liqo, Mudarissah, Nama Peserta, Foto)
    const participants = [
      { 
        liqo: "Liqo Khadijah - Palu Selatan",
        mudarissah: "Ustadzah Nurhaliza, S.Pd.I.",
        peserta: "Fulanah Binti Fulan", 
        photo: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400" 
      },
      { 
        liqo: "Liqo Aisyah - Palu Barat",
        mudarissah: "Ustadzah Rahmawati, M.Ag.",
        peserta: "Aisyah Az-Zahra", 
        photo: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=400" 
      },
      { 
        liqo: "Liqo Sumayyah - Mantikulore",
        mudarissah: "Ustadzah Fatimah, S.H.",
        peserta: "Khadijah Al-Kubra", 
        photo: "https://images.unsplash.com/photo-1580489944761-15a19d654956?w=400" 
      }
    ];

    let currentIndex = 0;

    function updateDisplay() {
      const card = document.getElementById('participantCard');
      const liqoEl = document.getElementById('liqoDisplay');
      const mudarissahEl = document.getElementById('mudarissahDisplay');
      const pesertaEl = document.getElementById('pesertaDisplay');
      const photoEl = document.getElementById('photoDisplay');

      // Reset Animasi
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = 'fadeInSlide 0.8s ease-out forwards';

      // Update Teks & Foto
      liqoEl.innerText = participants[currentIndex].liqo;
      mudarissahEl.innerText = participants[currentIndex].mudarissah;
      pesertaEl.innerText = participants[currentIndex].peserta;
      photoEl.src = participants[currentIndex].photo;
    }

    function nextParticipant() {
      currentIndex = (currentIndex + 1) % participants.length;
      updateDisplay();
    }

    function prevParticipant() {
      currentIndex = (currentIndex - 1 + participants.length) % participants.length;
      updateDisplay();
    }

    function togglePause() {
      alert("Autoplay dijeda.");
    }

    // Inisialisasi awal
    updateDisplay();
  </script>

</body>
</html>
