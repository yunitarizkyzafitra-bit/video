<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasyakuran Dirosa Angkatan IX</title>
  
  <!-- Font Islami & Elegan -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;600;700&display=swap">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    /* Container Utama dengan Background Panggung */
    .stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('./background.jpg'); /* File gambar panggung */
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Overlay Halus untuk Kedalaman Visual */
    .stage-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 100%);
      z-index: 1;
    }

    /* Papan Digital Pemanggilan Nama (Mewah & Profesional) */
    .display-card {
      position: relative;
      z-index: 2;
      width: 80%;
      max-width: 850px;
      padding: 35px 45px;
      text-align: center;
      
      /* Glassmorphism & Gold Styling */
      background: rgba(10, 25, 18, 0.75); /* Hijau Islami pekat transparan */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid #d4af37; /* Elemen Emas */
      border-radius: 20px;
      
      /* Efek Bayangan & Glow Emas */
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.6),
        0 0 25px rgba(212, 175, 55, 0.3),
        inset 0 0 15px rgba(212, 175, 55, 0.15);

      /* Animasi Masuk */
      animation: fadeInSlide 0.8s ease-out forwards;
    }

    /* Judul Kategori / Label Peserta */
    .display-card .sub-title {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      letter-spacing: 3px;
      color: #f3e5ab;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    /* Nama Peserta Utama */
    .display-card .participant-name {
      font-family: 'Cinzel', serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 215, 0, 0.4);
      margin: 10px 0;
      word-wrap: break-word;
    }

    /* Detail Tambahan (Kelompok / Halqah / Daerah) */
    .display-card .participant-detail {
      font-size: 1.1rem;
      color: #d4af37;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* Area Tombol Navigasi */
    .controls-container {
      position: absolute;
      bottom: 40px;
      z-index: 2;
      display: flex;
      gap: 15px;
    }

    .btn-control {
      background: rgba(15, 35, 25, 0.85);
      border: 1.5px solid #d4af37;
      color: #fff;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .btn-control:hover {
      background: #d4af37;
      color: #0d231a;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
      transform: translateY(-2px);
    }

    /* Keyframes Animasi Pemanggilan */
    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="stage-container">
    <div class="stage-overlay"></div>

    <!-- Papan Digital Pemanggilan Nama -->
    <div class="display-card" id="participantCard">
      <div class="sub-title">Peserta Tasyakuran</div>
      <div class="participant-name" id="nameDisplay">Fulanah Binti Fulan</div>
      <div class="participant-detail" id="detailDisplay">Kecamatan Palu Selatan</div>
    </div>

    <!-- Tombol Navigasi -->
    <div class="controls-container">
      <button class="btn-control" onclick="prevParticipant()">‹ Prev</button>
      <button class="btn-control" onclick="togglePause()">Pause</button>
      <button class="btn-control" onclick="nextParticipant()">Next ›</button>
    </div>
  </div>

  <script>
    // Contoh Data Peserta
    const participants = [
      { name: "Fulanah Binti Fulan", detail: "Kecamatan Palu Selatan" },
      { name: "Aisyah Az-Zahra", detail: "Kecamatan Palu Barat" },
      { name: "Khadijah Al-Kubra", detail: "Kecamatan Mantikulore" }
    ];

    let currentIndex = 0;

    function updateDisplay() {
      const card = document.getElementById('participantCard');
      const nameEl = document.getElementById('nameDisplay');
      const detailEl = document.getElementById('detailDisplay');

      // Reset animasi
      card.style.animation = 'none';
      card.offsetHeight; // trigger reflow
      card.style.animation = 'fadeInSlide 0.8s ease-out forwards';

      nameEl.innerText = participants[currentIndex].name;
      detailEl.innerText = participants[currentIndex].detail;
    }

    function nextParticipant() {
      currentIndex = (currentIndex + 1) % participants.length;
      updateDisplay();
    }

    function prevParticipant() {
      currentIndex = (currentIndex - 1 + participants.length) % participants.length;
      updateDisplay();
    }

    function togglePause() {
      alert("Autoplay dijeda.");
    }
  </script>

</body>
</html>
