<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasyakuran Dirosa Angkatan IX - Display Panggung</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap">

  <style>
    :root {
      --gold-main: #D4AF37;
      --gold-light: #F3E5AB;
      --bg-dark-green: rgba(5, 18, 12, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #000;
    }

    /* 1. LAYAR OPENING UTAMA DENGAN ORNAMEN & LAMPU LATAR ISLAMI MEGAH */
    .start-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 3000;
      background: radial-gradient(circle at center, #0d3826 0%, #04140d 60%, #010805 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      transition: opacity 1.2s ease, visibility 1.2s ease;
      overflow: hidden;
    }

    /* Efek Cahaya Lampu Latar & Ornamen Geometris Islami Megah di Background Opening */
    .start-screen::before {
      content: '';
      position: absolute;
      width: 150vw;
      height: 150vh;
      background: 
        radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 60%),
        linear-gradient(45deg, rgba(13, 56, 38, 0.4) 0%, transparent 50%),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(212, 175, 55, 0.03) 40px, rgba(212, 175, 55, 0.03) 80px);
      animation: ambientGlow 10s ease-in-out infinite alternate;
      z-index: 1;
      pointer-events: none;
    }

    /* Aksen Kubah / Lengkungan Islami Abstrak di Background */
    .start-screen::after {
      content: '';
      position: absolute;
      top: -10%;
      width: 600px;
      height: 600px;
      border: 2px dashed rgba(212, 175, 55, 0.2);
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(212, 175, 55, 0.1), inset 0 0 50px rgba(212, 175, 55, 0.1);
      z-index: 1;
      pointer-events: none;
    }

    @keyframes ambientGlow {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    .start-screen > * {
      position: relative;
      z-index: 2;
    }

    /* WADAH KARTU LOGO DIANGKAT LEBIH KE ATAS */
    .logo-card {
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid var(--gold-main);
      border-radius: 24px;
      padding: 18px 32px;
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 175, 55, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: -5px; /* Menaikan posisi logo secara visual */
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.6s ease;
    }

    .logo-card:hover {
      transform: scale(1.08);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 40px rgba(212, 175, 55, 0.7);
    }

    .logo-wahdah {
      width: 150px;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.6));
      transition: transform 0.5s ease;
    }

    .start-screen h1 {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 2.4rem;
      letter-spacing: 5px;
      text-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
      text-align: center;
    }

    .btn-start-event {
      background: linear-gradient(135deg, #d4af37, #997413);
      border: 2px solid #fff;
      color: #041B12;
      padding: 16px 42px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.8);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .btn-start-event:hover {
      transform: scale(1.06);
      box-shadow: 0 0 50px rgba(212, 175, 55, 1);
    }

    .start-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* 2. PANGGUNG DISPLAY UTAMA */
    .stage-container {
      position: relative;
      width: 100vw; height: 100vh;
      background-image: url('./background.jpg');
      background-position: center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .display-card {
      position: relative;
      z-index: 10;
      width: 68vw; max-width: 950px; min-height: 480px;
      padding: 35px 45px;
      display: flex; flex-direction: column; justify-content: center; gap: 20px;
      background: var(--bg-dark-green); 
      backdrop-filter: blur(20px);
      border: 3px solid var(--gold-main);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 35px rgba(212, 175, 55, 0.4);
      
      opacity: 0;
      transform: translateY(40px) scale(0.92);
      filter: blur(12px);
      transition: opacity 1.8s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 1.8s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 1.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform, filter;
    }

    .display-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0px);
    }

    .glass-header {
      align-self: center;
      padding: 10px 40px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(212, 175, 55, 0.6);
      border-radius: 35px;
    }

    .glass-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      letter-spacing: 5px;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .card-body {
      display: flex;
      align-items: center;
      gap: 35px;
    }

    /* KONTAINER BINGKAI FOTO PRESISI */
    .photo-container {
      flex-shrink: 0;
      width: 170px; height: 220px;
      border-radius: 18px;
      border: 3px solid var(--gold-main);
      overflow: hidden;
      background: #06150e;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6);
    }

    /* TRANSISI FOTO TERSINKRON DENGAN KARTU UTAMA */
    .photo-container img {
      width: 100%; 
      height: 100%;
      object-fit: contain; /* Presisi tanpa wajah terpotong dan otomatis mengecil pas di bingkai */
      object-position: center;
      background-color: #06150e;
      transition: transform 0.8s ease, filter 0.8s ease;
    }

    .info-container {
      flex-grow: 1;
      display: flex; flex-direction: column; gap: 10px;
    }

    .info-box .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold-main);
      font-weight: 600;
    }

    .info-box .value-liqo { font-size: 1.25rem; font-weight: 600; color: #e0e0e0; }
    .info-box .value-mudarissah { font-size: 1.3rem; font-weight: 600; color: var(--gold-light); }
    .info-box .value-peserta {
      font-family: 'Cinzel', serif;
      font-size: 2.6rem; font-weight: 800; color: #ffffff;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9);
    }

    .controls-container {
      position: absolute; bottom: 25px;
      display: flex; gap: 15px;
    }

    .btn-control {
      background: rgba(12, 30, 22, 0.9);
      border: 1.5px solid var(--gold-main);
      color: #fff;
      padding: 10px 28px;
      font-size: 0.9rem; font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-control:hover {
      background: var(--gold-main);
      color: #041B12;
    }
  </style>
</head>
<body>

  <!-- LAYAR OPENING DEPAN DENGAN ORNAMEN ISLAMI & LAMPU LATAR MEGAH -->
  <div class="start-screen" id="startScreen">
    <div class="logo-card">
      <img class="logo-wahdah" src="./logo MWD.png" alt="Logo MWD">
    </div>
    
    <h1>TASYAKURAN DIROSA IX</h1>
    <button class="btn-start-event" onclick="startEvent()">🎬 DIMULAI</button>
  </div>

  <!-- PANGGUNG DISPLAY UTAMA -->
  <div class="stage-container">
    <div class="display-card" id="participantCard">
      <div class="glass-header"><h2>Tasyakuran Dirosa</h2></div>
      <div class="card-body">
        <div class="photo-container">
          <img id="photoDisplay" src="https://via.placeholder.com/170x220" alt="Foto">
        </div>
        <div class="info-container">
          <div class="info-box"><div class="label">Kelompok / Liqo</div><div class="value-liqo" id="liqoDisplay">Menghubungkan Server...</div></div>
          <div class="info-box"><div class="label">Mudarissah</div><div class="value-mudarissah" id="mudarissahDisplay">Menghubungkan Server...</div></div>
          <div class="info-box"><div class="label">Nama Peserta</div><div class="value-peserta" id="pesertaDisplay">Memuat Data Aman...</div></div>
        </div>
      </div>
    </div>

    <!-- KONTROL NAVIGASI -->
    <div class="controls-container">
      <button class="btn-control" onclick="prevParticipant()">‹ Sebelum</button>
      <button class="btn-control" onclick="showOpening()">🏠 Kembali ke Opening</button>
      <button class="btn-control" onclick="nextParticipant()">Selanjutnya ›</button>
    </div>
  </div>

  <script>
    // --- KEAMANAN SIBER & PROTEKSI ENDPOINT ---
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', event => {
      if (
        event.key === 'F12' || 
        (event.ctrlKey && event.shiftKey && ['I', 'J', 'C'].includes(event.key.toUpperCase())) ||
        (event.ctrlKey && event.key.toUpperCase() === 'U')
      ) {
        event.preventDefault();
      }
    });

    const startScreen = document.getElementById('startScreen');
    const participantCard = document.getElementById('participantCard');
    const secureEndpoint = 'https://script.google.com/macros/s/AKfycbxUlLMk_v8BPLCFIdiMXVmT5YGhgqpDpSae7EJBYNnK5tE5xMoXAP4G4O-Qde7zr5_1fg/exec';

    let participants = [];
    let currentIndex = 0;
    let isTransitioning = false;

    async function fetchSecureSpreadsheetData() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);

        const response = await fetch(secureEndpoint, { 
          method: 'GET',
          mode: 'cors',
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);

        if (!response.ok) {
          throw new Error(`Respons Server Gagal: ${response.status}`);
        }

        const rawData = await response.json();

        if (Array.isArray(rawData) && rawData.length > 0) {
          participants = rawData.map(item => ({
            liqo: sanitizeInput(item.liqo || '-'),
            mudarissah: sanitizeInput(item.mudarissah || '-'),
            peserta: sanitizeInput(item.peserta || 'Peserta Tanpa Nama'),
            photo: sanitizeUrl(item.photo || 'https://via.placeholder.com/170x220')
          }));

          updateCardContent();
        } else {
          triggerEmptyDataState();
        }
      } catch (error) {
        console.warn('Kendala Sinkronisasi:', error);
        if (participants.length === 0) {
          participants = [
            { liqo: "SISTEM OFFLINE", mudarissah: "MOHON PERIKSA KONEKSI", peserta: "Sinkronisasi Tertunda", photo: "https://via.placeholder.com/170x220" }
          ];
        }
        updateCardContent();
      }
    }

    function sanitizeInput(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function sanitizeUrl(url) {
      if (typeof url === 'string' && (url.startsWith('http://') || url.startsWith('https://'))) {
        return url;
      }
      return 'https://via.placeholder.com/170x220';
    }

    function triggerEmptyDataState() {
      document.getElementById('liqoDisplay').innerText = "KOSONG";
      document.getElementById('mudarissahDisplay').innerText = "KOSONG";
      document.getElementById('pesertaDisplay').innerText = "Data Peserta Tidak Ditemukan";
    }

    function startEvent() {
      startScreen.classList.add('fade-out');
      setTimeout(() => {
        participantCard.classList.add('show');
      }, 3000);
    }

    function showOpening() {
      participantCard.classList.remove('show');
      setTimeout(() => {
        startScreen.classList.remove('fade-out');
      }, 500);
    }

    function updateCardContent() {
      if (participants.length === 0) return;
      document.getElementById('liqoDisplay').innerText = participants[currentIndex].liqo;
      document.getElementById('mudarissahDisplay').innerText = participants[currentIndex].mudarissah;
      document.getElementById('pesertaDisplay').innerText = participants[currentIndex].peserta;
      document.getElementById('photoDisplay').src = participants[currentIndex].photo;
    }

    // TRANSISI SINKRON SEMPURNA: Foto ikut memudar dan berganti selaras bersamaan dengan teks
    function updateDisplay() {
      if (isTransitioning || participants.length === 0) return;
      isTransitioning = true;

      participantCard.classList.remove('show');

      setTimeout(() => {
        updateCardContent();
        participantCard.classList.add('show');

        setTimeout(() => {
          isTransitioning = false;
        }, 800);
      }, 800);
    }

    function nextParticipant() { 
      if (participants.length === 0) return;
      currentIndex = (currentIndex + 1) % participants.length; 
      updateDisplay(); 
    }

    function prevParticipant() { 
      if (participants.length === 0) return;
      currentIndex = (currentIndex - 1 + participants.length) % participants.length; 
      updateDisplay(); 
    }

    // Inisialisasi awal
    fetchSecureSpreadsheetData();
  </script>

</body>
</html>
