<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasyakuran Dirosa Angkatan IX - Display Panggung</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap">

  <style>
    :root {
      --gold-main: #D4AF37;
      --gold-light: #F3E5AB;
      --bg-dark-green: rgba(5, 18, 12, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #000;
    }

    /* 1. LAYAR OPENING DEPAN DENGAN BACKGROUND EMAS */
    .start-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 3000;
      
      /* Menggunakan background gambar emas */
      background-image: url('./—Pngtree—abstract gradient golden background border_2499793.jpg');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
      transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), visibility 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .start-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* LOGO WAHDAH PALING ATAS */
    .logo-wahdah {
      width: 130px;
      height: auto;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
    }

    .start-screen h1 {
      font-family: 'Cinzel', serif;
      color: #3b2800; /* Warna teks gelap kontras dengan background emas */
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.6);
      text-align: center;
      max-width: 900px;
      line-height: 1.3;
    }

    .btn-start-event {
      margin-top: 15px;
      background: linear-gradient(135deg, #08291b, #020d08);
      border: 2px solid var(--gold-main);
      color: var(--gold-light);
      padding: 18px 45px;
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .btn-start-event:hover {
      transform: scale(1.06);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      background: linear-gradient(135deg, #0d3d29, #051a11);
    }

    /* 2. PANGGUNG DISPLAY UTAMA */
    .stage-container {
      position: relative;
      width: 100vw; height: 100vh;
      background-image: url('./background.jpg');
      background-position: center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* KARTU DENGAN TRANSISI HALUS */
    .display-card {
      position: relative;
      z-index: 10;
      width: 68vw; max-width: 950px; min-height: 480px;
      padding: 35px 45px;
      display: flex; flex-direction: column; justify-content: center; gap: 20px;
      background: var(--bg-dark-green); 
      backdrop-filter: blur(20px);
      border: 3px solid var(--gold-main);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 35px rgba(212, 175, 55, 0.4);
      
      opacity: 0;
      transform: translateY(35px) scale(0.95);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .display-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .glass-header {
      align-self: center;
      padding: 10px 40px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(212, 175, 55, 0.6);
      border-radius: 35px;
    }

    .glass-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      letter-spacing: 5px;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .card-body {
      display: flex;
      align-items: center;
      gap: 35px;
    }

    .photo-container {
      flex-shrink: 0;
      width: 170px; height: 220px;
      border-radius: 18px;
      border: 3px solid var(--gold-main);
      overflow: hidden;
      background: #0d231a;
      transition: opacity 0.8s ease;
    }

    .photo-container img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .info-container {
      flex-grow: 1;
      display: flex; flex-direction: column; gap: 10px;
      transition: opacity 0.8s ease;
    }

    .info-box .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold-main);
      font-weight: 600;
    }

    .info-box .value-liqo { font-size: 1.25rem; font-weight: 600; color: #e0e0e0; }
    .info-box .value-mudarissah { font-size: 1.3rem; font-weight: 600; color: var(--gold-light); }
    .info-box .value-peserta {
      font-family: 'Cinzel', serif;
      font-size: 2.6rem; font-weight: 800; color: #ffffff;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9);
    }

    .controls-container {
      position: absolute; bottom: 25px;
      display: flex; gap: 15px;
    }

    .btn-control {
      background: rgba(12, 30, 22, 0.9);
      border: 1.5px solid var(--gold-main);
      color: #fff;
      padding: 10px 28px;
      font-size: 0.9rem; font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-control:hover {
      background: var(--gold-main);
      color: #041B12;
    }
  </style>
</head>
<body>

  <!-- LAYAR OPENING DEPAN -->
  <div class="start-screen" id="startScreen">
    <!-- Logo Wahdah Islamiyah -->
    <img class="logo-wahdah" src="https://upload.wikimedia.org/wikipedia/commons/2/28/Logo_Wahdah_Islamiyah.png" alt="Logo Wahdah Islamiyah">
    
    <!-- Judul Acara -->
    <h1>TASYAKURAN DIROSA ANGKATAN IX</h1>
    
    <button class="btn-start-event" onclick="startEvent()">✨ MASUK KE PANGGUNG</button>
  </div>

  <!-- PANGGUNG DISPLAY UTAMA -->
  <div class="stage-container">
    <div class="display-card" id="participantCard">
      <div class="glass-header"><h2>Tasyakuran Dirosa</h2></div>
      <div class="card-body">
        <div class="photo-container"><img id="photoDisplay" src="https://via.placeholder.com/170x220" alt="Foto"></div>
        <div class="info-container">
          <div class="info-box"><div class="label">Kelompok / Liqo</div><div class="value-liqo" id="liqoDisplay">-</div></div>
          <div class="info-box"><div class="label">Mudarissah</div><div class="value-mudarissah" id="mudarissahDisplay">-</div></div>
          <div class="info-box"><div class="label">Nama Peserta</div><div class="value-peserta" id="pesertaDisplay">Siap Dipanggil...</div></div>
        </div>
      </div>
    </div>

    <!-- TOMBOL KONTROL -->
    <div class="controls-container">
      <button class="btn-control" onclick="prevParticipant()">‹ Sebelum</button>
      <button class="btn-control" onclick="showOpening()">🏠 Kembali ke Opening</button>
      <button class="btn-control" onclick="nextParticipant()">Selanjutnya ›</button>
    </div>
  </div>

  <script>
    const startScreen = document.getElementById('startScreen');
    const participantCard = document.getElementById('participantCard');

    function startEvent() {
      // Sembunyikan layar pembuka
      startScreen.classList.add('fade-out');

      // Tampilkan kartu panggung secara halus setelah opening hilang
      setTimeout(() => {
        participantCard.classList.add('show');
      }, 500);
    }

    function showOpening() {
      // Sembunyikan kartu panggung
      participantCard.classList.remove('show');

      // Munculkan kembali layar opening
      setTimeout(() => {
        startScreen.classList.remove('fade-out');
      }, 500);
    }

    // Data Peserta
    const participants = [
      { liqo: "AL-ALAQ 9.PB4", mudarissah: "EPA NURMALA", peserta: "Riska Rahayu, A.md.Kep", photo: "https://via.placeholder.com/170x220" },
      { liqo: "AL-ALAQ 9.PB4", mudarissah: "EPA NURMALA", peserta: "Anisya Ismail, A.md.Kep", photo: "https://via.placeholder.com/170x220" },
      { liqo: "AL-ALAQ 9.PB4", mudarissah: "EPA NURMALA", peserta: "Endang Sudariyaningsih", photo: "https://via.placeholder.com/170x220" }
    ];

    let currentIndex = 0;
    let isTransitioning = false;

    function updateDisplay() {
      if (isTransitioning) return;
      isTransitioning = true;

      participantCard.classList.remove('show');

      setTimeout(() => {
        document.getElementById('liqoDisplay').innerText = participants[currentIndex].liqo;
        document.getElementById('mudarissahDisplay').innerText = participants[currentIndex].mudarissah;
        document.getElementById('pesertaDisplay').innerText = participants[currentIndex].peserta;
        document.getElementById('photoDisplay').src = participants[currentIndex].photo;

        participantCard.classList.add('show');
        
        setTimeout(() => {
          isTransitioning = false;
        }, 600);
      }, 600);
    }

    function nextParticipant() { 
      currentIndex = (currentIndex + 1) % participants.length; 
      updateDisplay(); 
    }

    function prevParticipant() { 
      currentIndex = (currentIndex - 1 + participants.length) % participants.length; 
      updateDisplay(); 
    }

    // Inisialisasi data awal
    document.getElementById('liqoDisplay').innerText = participants[0].liqo;
    document.getElementById('mudarissahDisplay').innerText = participants[0].mudarissah;
    document.getElementById('pesertaDisplay').innerText = participants[0].peserta;
  </script>

</body>
</html>
