<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pemanggilan Peserta Tasyakuran Dirosa</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-emerald: #062619;
            --gold-light: #FCE081;
            --gold-main: #D4AF37;
            --gold-dark: #AA771C;
            --text-white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-emerald);
            color: var(--text-white);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* 1. Background Islami Terintegrasi */
        .stage-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Menggunakan Gambar Stage Visual Islami Mewah */
            background: url('https://v3b.cashify.in/cashify/product/img/xa/placeholder.png') center center / cover no-repeat;
            background-image: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.2) 0%, transparent 70%),
                              linear-gradient(135deg, rgba(6, 38, 25, 0.85) 0%, rgba(3, 18, 12, 0.95) 100%);
            z-index: 1;
        }

        /* Bingkai Ornamen Luar */
        .islamic-frame {
            position: absolute;
            inset: 15px;
            border: 2px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            pointer-events: none;
            z-index: 2;
            box-shadow: inset 0 0 35px rgba(212, 175, 55, 0.2);
        }

        .header-bar {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 10;
            text-align: center;
            width: 90%;
            justify-content: center;
        }

        .header-title {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #FFF6D0 0%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }

        /* Container Card Panggung */
        .stage-container {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 60px 60px 60px;
        }

        .card-container {
            display: flex;
            width: 100%;
            max-width: 1150px;
            height: 500px;
            background: rgba(3, 18, 12, 0.92); /* Background solid gelap menutup latar belakang secara bersih */
            backdrop-filter: blur(15px);
            border: 2px solid var(--gold-main);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(212, 175, 55, 0.3);
            overflow: hidden;
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 2. Sisi Kiri: Tempat Foto Bersih dari Tulisan */
        .photo-section {
            flex: 0 0 400px;
            background: #041810; /* Solid background tanpa teks/pola mengganggu */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-right: 2px solid rgba(212, 175, 55, 0.3);
        }

        .photo-frame {
            width: 290px;
            height: 370px;
            border-radius: 140px 140px 20px 20px;
            border: 4px solid var(--gold-main);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 25px rgba(212, 175, 55, 0.4);
            overflow: hidden;
            background: #082116; /* Clean background */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Sisi Kanan: Biodata Peserta */
        .details-section {
            flex: 1;
            padding: 45px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .group-badge {
            display: inline-block;
            align-self: flex-start;
            padding: 6px 20px;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-main));
            color: #000;
            font-weight: 700;
            font-size: 14px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .participant-name {
            font-family: 'Cinzel', serif;
            font-size: 38px;
            font-weight: 700;
            color: var(--gold-light);
            line-height: 1.25;
            margin-bottom: 22px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .meta-info {
            display: grid;
            grid-template-columns: 140px 1fr;
            row-gap: 12px;
            font-size: 18px;
            color: #D1E0D7;
        }

        .meta-label {
            font-weight: 600;
            color: var(--gold-main);
        }

        /* Progress Bar Timer 5 Detik */
        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
            transition: width 0.1s linear;
        }

        /* Tombol Kontrol Operator */
        .controls {
            position: absolute;
            bottom: 25px;
            right: 35px;
            z-index: 20;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .btn {
            background: transparent;
            border: 1px solid var(--gold-main);
            color: var(--gold-light);
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover {
            background: var(--gold-main);
            color: #000;
        }

        /* Animasi Transisi Halus */
        .slide-fade-enter {
            opacity: 0;
            transform: translateY(20px) scale(0.97);
        }

        .slide-fade-active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .slide-fade-exit {
            opacity: 0;
            transform: translateY(-20px) scale(0.97);
        }
    </style>
</head>
<body>

    <div class="stage-background"></div>
    <div class="islamic-frame"></div>

    <div class="header-bar">
        <div class="header-title">TASYAKURAN DIROSA ANGKATAN IX — DPD WAHDAH ISLAMIYAH PALU</div>
    </div>

    <div class="stage-container">
        <div class="card-container slide-fade-enter" id="participantCard">
            <!-- Tempat Foto Sisi Kiri (Bersih & Rapi) -->
            <div class="photo-section">
                <div class="photo-frame">
                    <img id="pPhoto" src="" alt="Foto Peserta">
                </div>
            </div>
            
            <!-- Biodata Peserta Sisi Kanan -->
            <div class="details-section">
                <div class="group-badge" id="pLiqo">Nama Liqo</div>
                <div class="participant-name" id="pName">Nama Peserta</div>
                
                <div class="meta-info">
                    <div class="meta-label">Mudarrisah:</div>
                    <div id="pMudarrisah">-</div>
                    <div class="meta-label">No. Urut:</div>
                    <div id="pNo">-</div>
                    <div class="meta-label">Alamat:</div>
                    <div id="pAlamat">-</div>
                </div>
            </div>

            <!-- Timer Progress Bar 5 Detik -->
            <div class="progress-bar-container">
                <div class="progress-bar" id="timerBar"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevParticipant()">❮ Prev</button>
        <button class="btn" onclick="togglePlay()" id="playBtn">Pause</button>
        <button class="btn" onclick="nextParticipant()">Next ❯</button>
    </div>

    <script>
        // 3. Konfigurasi Google Drive Foto Peserta
        // Format Direct Google Drive Image: https://lh3.googleusercontent.com/d/FILE_ID
        const GOOGLE_DRIVE_PHOTOS = {
            "Riska Rahayu, A.md.Kep": "https://lh3.googleusercontent.com/d/1SAMPLE_FILE_ID_1",
            "Anisya Ismail, A.md.Kep": "https://lh3.googleusercontent.com/d/1SAMPLE_FILE_ID_2"
            // Tambahkan nama peserta & link ID file Google Drive di sini
        };

        // Data 330 Peserta dari Excel
        const participants = [
            { no: 1, name: "Riska Rahayu, A.md.Kep", liqo: "AL-ALAQ 9.PB4", mudarrisah: "EPA NURMALA", alamat: "BTN green tinggede" },
            { no: 2, name: "Anisya Ismail, A.md.Kep", liqo: "AL-ALAQ 9.PB4", mudarrisah: "EPA NURMALA", alamat: "Puskud" },
            { no: 3, name: "Endang Sudariyaningsih", liqo: "AL-ALAQ 9.PB4", mudarrisah: "EPA NURMALA", alamat: "-" },
            { no: 4, name: "Apt. Nur Afiat. S. Farm", liqo: "AL-ALAQ 9.PB4", mudarrisah: "EPA NURMALA", alamat: "Jl. Dewi Sartika no. 6" },
            { no: 5, name: "Yulianingsih", liqo: "AL-ALAQ 9.PB4", mudarrisah: "EPA NURMALA", alamat: "-" },
            { no: 1, name: "Maria Ulfa, AMD.AK", liqo: "AL-ALAQ 9.MT7", mudarrisah: "NURIAN", alamat: "Jl. Tekukur" },
            { no: 2, name: "Lisnawati", liqo: "AL-ALAQ 9.MT7", mudarrisah: "NURIAN", alamat: "Jl. tekukur" },
            { no: 3, name: "Miliani", liqo: "AL-ALAQ 9.MT7", mudarrisah: "NURIAN", alamat: "Jl. Bulu Masomba" },
            { no: 4, name: "Warneng", liqo: "AL-ALAQ 9.MT7", mudarrisah: "NURIAN", alamat: "Jl. Tekukur" }
        ];

        let currentIndex = 0;
        let timerDuration = 5; // Durasi diubah menjadi 5 Detik per orang
        let remainingTime = timerDuration;
        let timerInterval = null;
        let isPlaying = true;

        const card = document.getElementById('participantCard');
        const pName = document.getElementById('pName');
        const pLiqo = document.getElementById('pLiqo');
        const pMudarrisah = document.getElementById('pMudarrisah');
        const pNo = document.getElementById('pNo');
        const pAlamat = document.getElementById('pAlamat');
        const pPhoto = document.getElementById('pPhoto');
        const timerBar = document.getElementById('timerBar');
        const playBtn = document.getElementById('playBtn');

        function getPhotoUrl(name) {
            if (GOOGLE_DRIVE_PHOTOS[name]) {
                return GOOGLE_DRIVE_PHOTOS[name];
            }
            // Default Silhouette SVG jika foto belum diunggah ke Drive
            return "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='290' height='370' viewBox='0 0 290 370'><rect width='100%' height='100%' fill='%23082116'/><circle cx='145' cy='130' r='60' fill='%23D4AF37' opacity='0.3'/><path d='M 45 320 C 45 230, 245 230, 245 320 Z' fill='%23D4AF37' opacity='0.3'/></svg>";
        }

        function renderParticipant(index) {
            const data = participants[index];
            
            // Animasi Keluar (Exit)
            card.classList.remove('slide-fade-active');
            card.classList.add('slide-fade-exit');

            setTimeout(() => {
                pName.innerText = data.name;
                pLiqo.innerText = data.liqo;
                pMudarrisah.innerText = data.mudarrisah;
                pNo.innerText = data.no;
                pAlamat.innerText = data.alamat;
                pPhoto.src = getPhotoUrl(data.name);

                // Animasi Masuk (Enter)
                card.classList.remove('slide-fade-exit');
                card.classList.add('slide-fade-enter');
                
                setTimeout(() => {
                    card.classList.remove('slide-fade-enter');
                    card.classList.add('slide-fade-active');
                }, 50);

                resetTimer();
            }, 300);
        }

        function resetTimer() {
            remainingTime = timerDuration;
            timerBar.style.width = '100%';
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPlaying) return;
                
                remainingTime -= 0.05;
                let pct = (remainingTime / timerDuration) * 100;
                timerBar.style.width = Math.max(0, pct) + '%';

                if (remainingTime <= 0) {
                    nextParticipant();
                }
            }, 50);
        }

        function nextParticipant() {
            currentIndex = (currentIndex + 1) % participants.length;
            renderParticipant(currentIndex);
        }

        function prevParticipant() {
            currentIndex = (currentIndex - 1 + participants.length) % participants.length;
            renderParticipant(currentIndex);
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            playBtn.innerText = isPlaying ? "Pause" : "Play";
        }

        // Pintasan Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') togglePlay();
            if (e.code === 'ArrowRight') nextParticipant();
            if (e.code === 'ArrowLeft') prevParticipant();
        });

        // Jalankan Aplikasi
        renderParticipant(0);
        startTimer();
    </script>
</body>
</html>
