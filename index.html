<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasyakuran Dirosa Angkatan IX</title>
  
  <!-- Font Islami & Elegan -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    /* Background Panggung Utama */
    .stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('./background.jpg');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 75px;
    }

    /* Card Digital Peserta (Diperbesar) */
    .display-card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 920px; /* Ukuran diperbesar */
      padding: 25px 35px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      
      /* Styling Mewah Glassmorphism */
      background: rgba(8, 22, 16, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid #d4af37;
      border-radius: 24px;
      
      /* Efek Bayangan & Glow Emas */
      box-shadow: 
        0 20px 45px rgba(0, 0, 0, 0.7),
        0 0 30px rgba(212, 175, 55, 0.35),
        inset 0 0 20px rgba(212, 175, 55, 0.15);

      /* Animasi Transisi */
      animation: fadeInSlide 0.8s ease-out forwards;
    }

    /* Header Tulisan Tasyakuran Dirosa dengan Efek Kaca (Glassmorphism) */
    .glass-header {
      align-self: center;
      padding: 8px 30px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.1);
      margin-bottom: 5px;
    }

    .glass-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      letter-spacing: 4px;
      color: #f3e5ab;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    /* Konten Utama Kartu */
    .card-body {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    /* Bingkai Foto Peserta (Diperbesar) */
    .photo-container {
      flex-shrink: 0;
      width: 140px;
      height: 175px;
      border-radius: 16px;
      border: 2px solid #d4af37;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      background: #0d231a;
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Informasi Teks */
    .info-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    /* 1. Nama Liqo */
    .info-box .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #d4af37;
      font-weight: 600;
    }

    .info-box .value-liqo {
      font-size: 1.1rem;
      font-weight: 600;
      color: #e0e0e0;
    }

    /* 2. Nama Mudarissah */
    .info-box .value-mudarissah {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f3e5ab;
    }

    /* 3. Nama Peserta (Utama) */
    .info-box .value-peserta {
      font-family: 'Cinzel', serif;
      font-size: 2.3rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 215, 0, 0.4);
      line-height: 1.2;
      margin-top: 2px;
    }

    /* Tombol Navigasi Kontrol */
    .controls-container {
      position: absolute;
      bottom: 20px;
      z-index: 2;
      display: flex;
      gap: 12px;
    }

    .btn-control {
      background: rgba(15, 35, 25, 0.85);
      border: 1.5px solid #d4af37;
      color: #fff;
      padding: 8px 22px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .btn-control:hover {
      background: #d4af37;
      color: #0d231a;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
      transform: translateY(-2px);
    }

    /* Keyframes Animasi Pemanggilan */
    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="stage-container">

    <!-- Card Pemanggilan Digital (Lebih Besar) -->
    <div class="display-card" id="participantCard">
      
      <!-- Header Efek Kaca / Glassmorphism -->
      <div class="glass-header">
        <h2>Tasyakuran Dirosa</h2>
      </div>

      <!-- Konten Utama Kartu -->
      <div class="card-body">
        <!-- Bingkai Foto Peserta -->
        <div class="photo-container">
          <img id="photoDisplay" src="https://via.placeholder.com/150x200" alt="Foto Peserta">
        </div>

        <!-- Informasi Detail Teks -->
        <div class="info-container">
          
          <!-- Nama Liqo -->
          <div class="info-box">
            <div class="label">Kelompok / Liqo</div>
            <div class="value-liqo" id="liqoDisplay">Liqo Khadijah - Palu Selatan</div>
          </div>

          <!-- Nama Mudarissah -->
          <div class="info-box">
            <div class="label">Mudarissah</div>
            <div class="value-mudarissah" id="mudarissahDisplay">Ustadzah Nurhaliza, S.Pd.I.</div>
          </div>

          <!-- Nama Peserta -->
          <div class="info-box">
            <div class="label">Nama Peserta</div>
            <div class="value-peserta" id="pesertaDisplay">Fulanah Binti Fulan</div>
          </div>

        </div>
      </div>

    </div>

    <!-- Kontrol Tombol Navigasi -->
    <div class="controls-container">
      <button class="btn-control" onclick="prevParticipant()">‹ Prev</button>
      <button class="btn-control" onclick="togglePause()">Pause</button>
      <button class="btn-control" onclick="nextParticipant()">Next ›</button>
    </div>

  </div>

  <script>
    // Data Peserta Terintegrasi (Liqo, Mudarissah, Nama Peserta, Foto)
    const participants = [
      { 
        liqo: "Liqo Khadijah - Palu Selatan",
        mudarissah: "Ustadzah Nurhaliza, S.Pd.I.",
        peserta: "Fulanah Binti Fulan", 
        photo: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=300" 
      },
      { 
        liqo: "Liqo Aisyah - Palu Barat",
        mudarissah: "Ustadzah Rahmawati, M.Ag.",
        peserta: "Aisyah Az-Zahra", 
        photo: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=300" 
      },
      { 
        liqo: "Liqo Sumayyah - Mantikulore",
        mudarissah: "Ustadzah Fatimah, S.H.",
        peserta: "Khadijah Al-Kubra", 
        photo: "https://images.unsplash.com/photo-1580489944761-15a19d654956?w=300" 
      }
    ];

    let currentIndex = 0;

    function updateDisplay() {
      const card = document.getElementById('participantCard');
      const liqoEl = document.getElementById('liqoDisplay');
      const mudarissahEl = document.getElementById('mudarissahDisplay');
      const pesertaEl = document.getElementById('pesertaDisplay');
      const photoEl = document.getElementById('photoDisplay');

      // Reset Animasi
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = 'fadeInSlide 0.8s ease-out forwards';

      // Update Teks & Foto
      liqoEl.innerText = participants[currentIndex].liqo;
      mudarissahEl.innerText = participants[currentIndex].mudarissah;
      pesertaEl.innerText = participants[currentIndex].peserta;
      photoEl.src = participants[currentIndex].photo;
    }

    function nextParticipant() {
      currentIndex = (currentIndex + 1) % participants.length;
      updateDisplay();
    }

    function prevParticipant() {
      currentIndex = (currentIndex - 1 + participants.length) % participants.length;
      updateDisplay();
    }

    function togglePause() {
      alert("Autoplay dijeda.");
    }

    // Inisialisasi awal
    updateDisplay();
  </script>

</body>
</html>
