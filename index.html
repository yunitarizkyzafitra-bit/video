<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Digital Terintegrasi - Tasyakuran Dirosa</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap">

  <style>
    :root {
      --gold-main: #D4AF37;
      --gold-light: #F3E5AB;
      --bg-dark-green: rgba(5, 18, 12, 0.96);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #000;
    }

    /* LAYAR OPENING UTAMA */
    .start-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 3000;
      background: radial-gradient(circle at center, #07472c 0%, #032114 50%, #010c07 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      transition: opacity 1s ease, visibility 1s ease;
    }

    .start-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .logo-card {
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid var(--gold-main);
      border-radius: 24px;
      padding: 20px 36px;
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 35px rgba(212, 175, 55, 0.4);
    }

    .logo-wahdah {
      width: 140px;
      height: auto;
      filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.7));
    }

    .start-screen h1 {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 2.4rem;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.7);
      text-align: center;
    }

    .btn-start-event {
      background: linear-gradient(135deg, #d4af37, #997413);
      border: 2px solid #fff;
      color: #041B12;
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
      transition: transform 0.3s ease;
    }

    .btn-start-event:hover {
      transform: scale(1.05);
    }

    /* PANGGUNG UTAMA DISPLAY BUKU DIGITAL */
    .stage-container {
      position: relative;
      width: 100vw; height: 100vh;
      background: #03150d;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .display-card {
      position: relative;
      z-index: 10;
      width: 75vw; max-width: 980px; min-height: 460px;
      padding: 35px 45px;
      display: flex; flex-direction: column; justify-content: center; gap: 22px;
      background: var(--bg-dark-green); 
      backdrop-filter: blur(20px);
      border: 3px solid var(--gold-main);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(212, 175, 55, 0.3);
      
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .display-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .glass-header {
      align-self: center;
      padding: 8px 30px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 30px;
    }

    .glass-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      letter-spacing: 4px;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .card-body {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    /* KOTAK FOTO KLIEN */
    .photo-container {
      flex-shrink: 0;
      width: 200px; height: 255px;
      border-radius: 18px;
      border: 3px solid var(--gold-main);
      overflow: hidden;
      background: #06150e;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.7), 0 5px 20px rgba(0,0,0,0.5);
    }

    .photo-container img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: opacity 0.4s ease-in-out;
    }

    .photo-container img.fade-anim {
      opacity: 0;
    }

    /* INFORMASI TEKS */
    .info-container {
      flex-grow: 1;
      display: flex; flex-direction: column; gap: 12px;
    }

    .info-box .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold-main);
      font-weight: 600;
    }

    .info-box .value-liqo { font-size: 1.2rem; font-weight: 600; color: #ddd; }
    .info-box .value-mudarissah { font-size: 1.3rem; font-weight: 600; color: var(--gold-light); }
    .info-box .value-peserta {
      font-family: 'Cinzel', serif;
      font-size: 2.3rem; font-weight: 800; color: #fff;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.8);
      line-height: 1.2;
    }

    /* TOMBOL NAVIGASI BAWAH */
    .controls-container {
      position: absolute; bottom: 20px;
      display: flex; gap: 10px; align-items: center;
    }

    .btn-control {
      background: rgba(12, 30, 22, 0.9);
      border: 1.5px solid var(--gold-main);
      color: #fff;
      padding: 8px 18px;
      font-size: 0.8rem; font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-control:hover {
      background: var(--gold-main);
      color: #041B12;
    }

    .btn-auto {
      background: linear-gradient(135deg, #d4af37, #997413);
      color: #041B12;
      font-weight: 700;
    }

    .counter-indicator {
      color: var(--gold-light);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <!-- LAYAR OPENING -->
  <div class="start-screen" id="startScreen">
    <div class="logo-card">
      <img class="logo-wahdah" src="./logo MWD.png" alt="Logo">
    </div>
    <h1>BUKU DIGITAL TERINTEGRASI</h1>
    <button class="btn-start-event" onclick="startApp()">🚀 BUKA APLIKASI</button>
  </div>

  <!-- HALAMAN UTAMA -->
  <div class="stage-container">
    <div class="display-card" id="participantCard">
      <div class="glass-header"><h2>Direktori Peserta</h2></div>
      <div class="card-body">
        <div class="photo-container">
          <img id="photoDisplay" src="https://via.placeholder.com/210x265" alt="Foto">
        </div>
        <div class="info-container">
          <div class="info-box"><div class="label">Liqo</div><div class="value-liqo" id="liqoDisplay">Memuat data...</div></div>
          <div class="info-box"><div class="label">Mudarissah</div><div class="value-mudarissah" id="mudarissahDisplay">Memuat data...</div></div>
          <div class="info-box"><div class="label">Nama Peserta</div><div class="value-peserta" id="pesertaDisplay">Sinkronisasi Cloud...</div></div>
        </div>
      </div>
    </div>

    <!-- KONTROL -->
    <div class="controls-container">
      <button class="btn-control" onclick="prevItem()">‹ Sebelumnya</button>
      <button class="btn-control" onclick="returnToOpening()">🏠 Beranda</button>
      <button class="btn-control" onclick="nextItem()">Berikutnya ›</button>
      <button class="btn-control btn-auto" id="btnAuto" onclick="toggleAuto()">▶ Auto Play</button>
      <span class="counter-indicator" id="counter">0 / 0</span>
    </div>
  </div>

  <script>
    // Ganti URL di bawah ini dengan Web App URL dari Google Apps Script Anda
    const endpoint = 'https://script.google.com/macros/s/AKfycbyb4ppo5FljvftzimCOc-NyQcsxsdXD-k-MEZtovAwOqEJF4qDvqhkfimwDqY7G0s0g/exec';

    let dataList = [];
    let currentIndex = 0;
    let autoTimer = null;
    let isPlaying = false;

    async function loadData() {
      try {
        let res = await fetch(endpoint);
        let json = await res.json();
        if (Array.isArray(json) && json.length > 0) {
          dataList = json;
          updateView(false);
        } else {
          document.getElementById('pesertaDisplay').innerText = "Data Kosong";
        }
      } catch (err) {
        console.error("Gagal memuat:", err);
        document.getElementById('pesertaDisplay').innerText = "Koneksi Cloud Gagal";
      }
    }

    function startApp() {
      document.getElementById('startScreen').classList.add('fade-out');
      setTimeout(() => {
        document.getElementById('participantCard').classList.add('show');
      }, 400);
    }

    function returnToOpening() {
      stopAuto();
      document.getElementById('participantCard').classList.remove('show');
      setTimeout(() => {
        document.getElementById('startScreen').classList.remove('fade-out');
      }, 400);
    }

    function updateView(withFade = true) {
      if (dataList.length === 0) return;
      let curr = dataList[currentIndex];

      document.getElementById('liqoDisplay').innerText = curr.liqo;
      document.getElementById('mudarissahDisplay').innerText = curr.mudarissah;
      document.getElementById('pesertaDisplay').innerText = curr.peserta;

      let img = document.getElementById('photoDisplay');
      if (withFade) {
        img.classList.add('fade-anim');
        setTimeout(() => {
          img.src = curr.photo;
          img.onload = () => img.classList.remove('fade-anim');
        }, 200);
      } else {
        img.src = curr.photo;
      }

      document.getElementById('counter').innerText = `${currentIndex + 1} / ${dataList.length}`;
    }

    function nextItem() {
      if (dataList.length === 0) return;
      currentIndex = (currentIndex + 1) % dataList.length;
      updateView(true);
    }

    function prevItem() {
      if (dataList.length === 0) return;
      currentIndex = (currentIndex - 1 + dataList.length) % dataList.length;
      updateView(true);
    }

    function toggleAuto() {
      let btn = document.getElementById('btnAuto');
      if (!isPlaying) {
        isPlaying = true;
        btn.innerText = "⏸ Jeda";
        autoTimer = setInterval(nextItem, 4000);
      } else {
        stopAuto();
      }
    }

    function stopAuto() {
      isPlaying = false;
      let btn = document.getElementById('btnAuto');
      if (btn) btn.innerText = "▶ Auto Play";
      if (autoTimer) clearInterval(autoTimer);
    }

    // Inisialisasi awal
    loadData();
  </script>
</body>
</html>
