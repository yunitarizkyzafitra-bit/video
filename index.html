<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasyakuran Dirosa Angkatan IX</title>
  
  <!-- Font Islami & Elegan -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #000;
    }

    /* ----------------------------------
       1. LAYAR START (IZIN AUTOPLAY BROWSER)
    ---------------------------------- */
    .start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2000;
      background: #041B12;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .btn-start-app {
      background: linear-gradient(135deg, #d4af37, #aa7c11);
      border: 2px solid #fff;
      color: #041B12;
      padding: 16px 40px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
      transition: transform 0.2s ease;
    }

    .btn-start-app:hover {
      transform: scale(1.08);
    }

    /* ----------------------------------
       2. LAYAR VIDEO INTRO
    ---------------------------------- */
    .intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1000;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 1;
      visibility: visible;
      transition: opacity 1s ease, visibility 1s ease;
    }

    .intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-skip {
      position: absolute;
      bottom: 30px;
      right: 30px;
      z-index: 1010;
      background: rgba(12, 30, 22, 0.85);
      border: 2px solid #d4af37;
      color: #fff;
      padding: 12px 30px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
    }

    /* ----------------------------------
       3. PANGGUNG UTAMA & KARTU NAMA
    ---------------------------------- */
    .stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('./background.jpg');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .display-card {
      position: relative;
      z-index: 10;
      width: 68vw;
      max-width: 950px;
      min-height: 480px;
      padding: 35px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      background: rgba(5, 18, 12, 0.94); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 3px solid #d4af37;
      border-radius: 28px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.85),
        0 0 35px rgba(212, 175, 55, 0.4),
        inset 0 0 20px rgba(212, 175, 55, 0.2);
    }

    .glass-header {
      align-self: center;
      padding: 10px 40px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(212, 175, 55, 0.6);
      border-radius: 35px;
      margin-bottom: 5px;
    }

    .glass-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      letter-spacing: 5px;
      color: #f3e5ab;
      text-transform: uppercase;
    }

    .card-body {
      display: flex;
      align-items: center;
      gap: 35px;
    }

    .photo-container {
      flex-shrink: 0;
      width: 170px;
      height: 220px;
      border-radius: 18px;
      border: 3px solid #d4af37;
      overflow: hidden;
      background: #0d231a;
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .info-box .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #d4af37;
      font-weight: 600;
    }

    .info-box .value-liqo {
      font-size: 1.25rem;
      font-weight: 600;
      color: #e0e0e0;
    }

    .info-box .value-mudarissah {
      font-size: 1.3rem;
      font-weight: 600;
      color: #f3e5ab;
    }

    .info-box .value-peserta {
      font-family: 'Cinzel', serif;
      font-size: 2.6rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.15;
    }

    .controls-container {
      position: absolute;
      bottom: 25px;
      z-index: 10;
      display: flex;
      gap: 15px;
    }

    .btn-control {
      background: rgba(12, 30, 22, 0.9);
      border: 1.5px solid #d4af37;
      color: #fff;
      padding: 10px 28px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
    }

    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- 1. SCREEN AWAL PEMANASAN AUTOPLAY -->
  <div class="start-screen" id="startScreen">
    <h1 style="color: #f3e5ab; font-family: 'Cinzel', serif;">TASYAKURAN DIROSA IX</h1>
    <button class="btn-start-app" onclick="startEvent()">🎬 MULAI ACARA</button>
  </div>

  <!-- 2. OVERLAY VIDEO INTRO PEMBUKA -->
  <div class="intro-overlay" id="introOverlay">
    <video class="intro-video" id="introVideo" playsinline preload="auto">
      <!-- Pastikan file video bernama video_1.mp4 di folder yang sama -->
      <source src="./video_1.mp4" type="video/mp4">
      Browser tidak mendukung format video ini.
    </video>
    <button class="btn-skip" onclick="finishIntro()">Lewati Video ›</button>
  </div>

  <!-- 3. PANGGUNG APLIKASI -->
  <div class="stage-container">
    <div class="display-card" id="participantCard">
      <div class="glass-header">
        <h2>Tasyakuran Dirosa</h2>
      </div>

      <div class="card-body">
        <div class="photo-container">
          <img id="photoDisplay" src="https://via.placeholder.com/170x220" alt="Foto Peserta">
        </div>

        <div class="info-container">
          <div class="info-box">
            <div class="label">Kelompok / Liqo</div>
            <div class="value-liqo" id="liqoDisplay">-</div>
          </div>

          <div class="info-box">
            <div class="label">Mudarissah</div>
            <div class="value-mudarissah" id="mudarissahDisplay">-</div>
          </div>

          <div class="info-box">
            <div class="label">Nama Peserta</div>
            <div class="value-peserta" id="pesertaDisplay">Menunggu Pemanggilan...</div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls-container">
      <button class="btn-control" onclick="prevParticipant()">‹ Prev</button>
      <button class="btn-control" onclick="replayIntro()">🎥 Putar Ulang Video Intro</button>
      <button class="btn-control" onclick="nextParticipant()">Next ›</button>
    </div>
  </div>

  <script>
    const startScreen = document.getElementById('startScreen');
    const introOverlay = document.getElementById('introOverlay');
    const introVideo = document.getElementById('introVideo');

    // 1. Fungsi Klik Mulai Acara oleh Operator
    function startEvent() {
      startScreen.style.display = 'none';
      introVideo.currentTime = 0;
      introVideo.play().catch(function(error) {
        console.log("Autoplay video gagal:", error);
      });
    }

    // 2. Video Selesai Otomatis -> Tutup Intro
    introVideo.addEventListener('ended', function() {
      finishIntro();
    });

    function finishIntro() {
      introOverlay.classList.add('hidden');
      introVideo.pause();
    }

    function replayIntro() {
      introOverlay.classList.remove('hidden');
      introVideo.currentTime = 0;
      introVideo.play();
    }

    // Data Contoh Peserta
    const participants = [
      { 
        liqo: "AL-ALAQ 9.PB4",
        mudarissah: "EPA NURMALA",
        peserta: "Riska Rahayu, A.md.Kep", 
        photo: "https://via.placeholder.com/170x220" 
      },
      { 
        liqo: "AL-ALAQ 9.PB4",
        mudarissah: "EPA NURMALA",
        peserta: "Anisya Ismail, A.md.Kep", 
        photo: "https://via.placeholder.com/170x220" 
      }
    ];

    let currentIndex = 0;

    function updateDisplay() {
      const card = document.getElementById('participantCard');
      const liqoEl = document.getElementById('liqoDisplay');
      const mudarissahEl = document.getElementById('mudarissahDisplay');
      const pesertaEl = document.getElementById('pesertaDisplay');
      const photoEl = document.getElementById('photoDisplay');

      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = 'fadeInSlide 0.8s ease-out forwards';

      liqoEl.innerText = participants[currentIndex].liqo;
      mudarissahEl.innerText = participants[currentIndex].mudarissah;
      pesertaEl.innerText = participants[currentIndex].peserta;
      photoEl.src = participants[currentIndex].photo;
    }

    function nextParticipant() {
      currentIndex = (currentIndex + 1) % participants.length;
      updateDisplay();
    }

    function prevParticipant() {
      currentIndex = (currentIndex - 1 + participants.length) % participants.length;
      updateDisplay();
    }

    updateDisplay();
  </script>

</body>
</html>
