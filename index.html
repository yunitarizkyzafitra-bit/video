<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasyakuran Dirosa Angkatan IX - Display Panggung</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap">

  <style>
    :root {
      --gold-main: #D4AF37;
      --gold-light: #F3E5AB;
      --bg-dark-green: rgba(5, 18, 12, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #000;
    }

    /* 1. LAYAR OPENING UTAMA: BACKGROUND HIJAU ISLAMI & ORNAMEN KEEMASAN MEWAH */
    .start-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 3000;
      background: radial-gradient(circle at center, #07472c 0%, #032114 50%, #010c07 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      transition: opacity 1.2s ease, visibility 1.2s ease;
      overflow: hidden;
    }

    .start-screen::before {
      content: '';
      position: absolute;
      width: 180vw;
      height: 180vh;
      background: 
        radial-gradient(circle, rgba(212, 175, 55, 0.3) 0%, rgba(3, 33, 20, 0) 65%),
        linear-gradient(135deg, rgba(212, 175, 55, 0.08) 0%, transparent 50%, rgba(212, 175, 55, 0.08) 100%),
        repeating-linear-gradient(45deg, rgba(212, 175, 55, 0.04) 0px, rgba(212, 175, 55, 0.04) 2px, transparent 2px, transparent 30px);
      animation: ambientGlow 10s ease-in-out infinite alternate;
      z-index: 1;
      pointer-events: none;
    }

    .start-screen::after {
      content: '';
      position: absolute;
      width: 88vw;
      height: 86vh;
      border: 3px solid rgba(212, 175, 55, 0.5);
      border-radius: 35px;
      box-shadow: 0 0 60px rgba(212, 175, 55, 0.3), inset 0 0 50px rgba(212, 175, 55, 0.3);
      z-index: 1;
      pointer-events: none;
    }

    @keyframes ambientGlow {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    .start-screen > * {
      position: relative;
      z-index: 2;
    }

    .logo-card {
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid var(--gold-main);
      border-radius: 24px;
      padding: 20px 36px;
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 35px rgba(212, 175, 55, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: -10px;
      animation: logoPulse 3s ease-in-out infinite;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes logoPulse {
      0% { transform: scale(1); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.4); }
      50% { transform: scale(1.04); box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 45px rgba(212, 175, 55, 0.7); }
      100% { transform: scale(1); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.4); }
    }

    .logo-wahdah {
      width: 150px;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.7));
    }

    .start-screen h1 {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 2.6rem;
      letter-spacing: 5px;
      text-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
      text-align: center;
    }

    .btn-start-event {
      background: linear-gradient(135deg, #d4af37, #997413);
      border: 2px solid #fff;
      color: #041B12;
      padding: 16px 42px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.8);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .btn-start-event:hover {
      transform: scale(1.06);
      box-shadow: 0 0 50px rgba(212, 175, 55, 1);
    }

    .start-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* 2. PANGGUNG DISPLAY UTAMA */
    .stage-container {
      position: relative;
      width: 100vw; height: 100vh;
      background-image: url('./background.jpg');
      background-position: center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .display-card {
      position: relative;
      z-index: 10;
      width: 72vw; max-width: 1000px; min-height: 480px;
      padding: 35px 50px;
      display: flex; flex-direction: column; justify-content: center; gap: 24px;
      background: var(--bg-dark-green); 
      backdrop-filter: blur(20px);
      border: 3px solid var(--gold-main);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 35px rgba(212, 175, 55, 0.4);
      
      opacity: 0;
      transform: translateY(40px) scale(0.92);
      filter: blur(12px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 1.2s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform, filter;
    }

    .display-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0px);
    }

    .glass-header {
      align-self: center;
      padding: 10px 40px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(212, 175, 55, 0.6);
      border-radius: 35px;
    }

    .glass-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      letter-spacing: 5px;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .card-body {
      display: flex;
      align-items: center;
      gap: 45px;
    }

    /* BINGKAI FOTO DIPERBESAR AGAR PRESISI SEIMBANG DENGAN BLOK TEKS KARTU */
    .photo-container {
      flex-shrink: 0;
      width: 210px; height: 265px;
      border-radius: 20px;
      border: 3px solid var(--gold-main);
      overflow: hidden;
      background: #06150e;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6), 0 8px 25px rgba(0,0,0,0.5);
    }

    .photo-container img {
      width: 100%; 
      height: 100%;
      object-fit: cover;
      object-position: center top;
      background-color: #06150e;
      opacity: 1;
      transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
    }

    .photo-container img.fade-anim {
      opacity: 0;
      transform: scale(0.95);
    }

    /* KONTEN INFORMASI TERSUSUN PRESISI RAPI */
    .info-container {
      flex-grow: 1;
      display: flex; flex-direction: column; gap: 14px;
      justify-content: center;
    }

    .info-box {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .info-box .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold-main);
      font-weight: 600;
    }

    .info-box .value-liqo { font-size: 1.3rem; font-weight: 600; color: #e0e0e0; }
    .info-box .value-mudarissah { font-size: 1.35rem; font-weight: 600; color: var(--gold-light); }
    .info-box .value-peserta {
      font-family: 'Cinzel', serif;
      font-size: 2.5rem; font-weight: 800; color: #ffffff;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9);
      line-height: 1.2;
    }

    .controls-container {
      position: absolute; bottom: 25px;
      display: flex; gap: 12px;
      align-items: center;
    }

    .btn-control {
      background: rgba(12, 30, 22, 0.9);
      border: 1.5px solid var(--gold-main);
      color: #fff;
      padding: 10px 22px;
      font-size: 0.85rem; font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-control:hover {
      background: var(--gold-main);
      color: #041B12;
    }

    .btn-auto {
      background: linear-gradient(135deg, #d4af37, #997413);
      color: #041B12;
      font-weight: 700;
    }

    .counter-indicator {
      color: var(--gold-light);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-left: 5px;
    }
  </style>
</head>
<body>

  <!-- LAYAR OPENING DEPAN: HIJAU ISLAMI & ORNAMEN KEEMASAN MEWAH -->
  <div class="start-screen" id="startScreen">
    <div class="logo-card">
      <img class="logo-wahdah" src="./logo MWD.png" alt="Logo MWD">
    </div>
    
    <h1>TASYAKURAN DIROSA ANGKATAN IX</h1>
    <button class="btn-start-event" onclick="startEvent()">🎬 DIMULAI</button>
  </div>

  <!-- PANGGUNG DISPLAY UTAMA -->
  <div class="stage-container">
    <div class="display-card" id="participantCard">
      <div class="glass-header"><h2>Tasyakuran Dirosa</h2></div>
      <div class="card-body">
        <div class="photo-container">
          <img id="photoDisplay" src="https://via.placeholder.com/210x265" alt="Foto Peserta">
        </div>
        <div class="info-container">
          <div class="info-box"><div class="label">Liqo</div><div class="value-liqo" id="liqoDisplay">Menghubungkan Server...</div></div>
          <div class="info-box"><div class="label">Mudarissah</div><div class="value-mudarissah" id="mudarissahDisplay">Menghubungkan Server...</div></div>
          <div class="info-box"><div class="label">Nama Peserta</div><div class="value-peserta" id="pesertaDisplay">Memuat Data Aman...</div></div>
        </div>
      </div>
    </div>

    <!-- KONTROL NAVIGASI & MODE OTOMATIS -->
    <div class="controls-container">
      <button class="btn-control" onclick="prevParticipant()">‹ Sebelum</button>
      <button class="btn-control" onclick="showOpening()">🏠 Opening</button>
      <button class="btn-control" onclick="nextParticipant()">Selanjutnya ›</button>
      <button class="btn-control btn-auto" id="btnAutoToggle" onclick="toggleAutoPlay()">▶ Play Otomatis</button>
      <span class="counter-indicator" id="counterIndicator">0 / 0</span>
    </div>
  </div>

  <script>
    // --- KEAMANAN SIBER & PROTEKSI ENDPOINT ---
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', event => {
      if (
        event.key === 'F12' || 
        (event.ctrlKey && event.shiftKey && ['I', 'J', 'C'].includes(event.key.toUpperCase())) ||
        (event.ctrlKey && event.key.toUpperCase() === 'U')
      ) {
        event.preventDefault();
      }
    });

    const startScreen = document.getElementById('startScreen');
    const participantCard = document.getElementById('participantCard');
    const secureEndpoint = 'https://script.google.com/macros/s/AKfycbxUlLMk_v8BPLCFIdiMXVmT5YGhgqpDpSae7EJBYNnK5tE5xMoXAP4G4O-Qde7zr5_1fg/exec';

    let participants = [];
    let currentIndex = 0;
    let isTransitioning = false;
    let autoPlayTimer = null;
    let isAutoPlaying = false;

    // Fungsi canggih untuk membersihkan karakter entitas HTML dan format teks liqo secara total
    function cleanLiqoName(str) {
      if (!str) return '-';
      
      let clean = String(str)
        .replace(/&(#39|#039|amp|quot|lt|gt);/gi, (match) => {
          const lower = match.toLowerCase();
          if (lower.includes('39')) return "'";
          if (lower.includes('amp')) return '&';
          if (lower.includes('quot')) return '"';
          if (lower.includes('lt')) return '<';
          if (lower.includes('gt')) return '>';
          return '';
        })
        .replace(/&#39;/g, "'")
        .replace(/&amp;/g, "&");

      // Menghilangkan awalan teks "Liqo" atau "Kelompok"
      clean = clean.replace(/^(liqo|kelompok)\s+/i, '').trim();
      
      // Menangani kasus string rusak seperti "Al &#039;Alaq" atau variasi simbol terpisah
      clean = clean.replace(/al\s*['`´]/gi, "Al-'");

      return clean;
    }

    function sanitizeInput(str) {
      return String(str)
        .replace(/&(#39|#039|amp|quot|lt|gt);/gi, (match) => {
          const lower = match.toLowerCase();
          if (lower.includes('39')) return "'";
          if (lower.includes('amp')) return '&';
          if (lower.includes('quot')) return '"';
          if (lower.includes('lt')) return '<';
          if (lower.includes('gt')) return '>';
          return '';
        })
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function sanitizeUrl(url) {
      if (typeof url === 'string' && (url.startsWith('http://') || url.startsWith('https://'))) {
        return url;
      }
      return 'https://via.placeholder.com/210x265';
    }

    async function fetchSecureSpreadsheetData() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 12000);

        const response = await fetch(secureEndpoint, { 
          method: 'GET',
          mode: 'cors',
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);

        if (!response.ok) {
          throw new Error(`Respons Server Gagal: ${response.status}`);
        }

        const rawData = await response.json();

        if (Array.isArray(rawData) && rawData.length > 0) {
          participants = rawData.map(item => {
            const rawLiqoText = item.liqo || '-';
            const formattedLiqo = cleanLiqoName(rawLiqoText);
            return {
              liqoRaw: formattedLiqo.toLowerCase(),
              liqo: sanitizeInput(formattedLiqo),
              mudarissah: sanitizeInput(item.mudarissah || '-'),
              peserta: sanitizeInput(item.peserta || 'Peserta Tanpa Nama'),
              photo: sanitizeUrl(item.photo || 'https://via.placeholder.com/210x265')
            };
          });

          participants.sort((a, b) => {
            if (a.liqoRaw < b.liqoRaw) return -1;
            if (a.liqoRaw > b.liqoRaw) return 1;
            return 0;
          });

          updateCardContent(false);
          updateCounter();
        } else {
          triggerEmptyDataState();
        }
      } catch (error) {
        console.warn('Kendala Sinkronisasi:', error);
        if (participants.length === 0) {
          participants = [
            { liqo: "SISTEM OFFLINE", mudarissah: "MOHON PERIKSA KONEKSI", peserta: "Sinkronisasi Tertunda", photo: "https://via.placeholder.com/210x265" }
          ];
        }
        updateCardContent(false);
        updateCounter();
      }
    }

    function triggerEmptyDataState() {
      document.getElementById('liqoDisplay').innerText = "KOSONG";
      document.getElementById('mudarissahDisplay').innerText = "KOSONG";
      document.getElementById('pesertaDisplay').innerText = "Data Peserta Tidak Ditemukan";
    }

    function startEvent() {
      startScreen.classList.add('fade-out');
      setTimeout(() => {
        participantCard.classList.add('show');
      }, 3000);
    }

    function showOpening() {
      stopAutoPlay();
      participantCard.classList.remove('show');
      setTimeout(() => {
        startScreen.classList.remove('fade-out');
      }, 500);
    }

    function updateCardContent(withPhotoFade = true) {
      if (participants.length === 0) return;
      
      const currentData = participants[currentIndex];
      
      document.getElementById('liqoDisplay').innerText = currentData.liqo;
      document.getElementById('mudarissahDisplay').innerText = currentData.mudarissah;
      document.getElementById('pesertaDisplay').innerText = currentData.peserta;

      const photoEl = document.getElementById('photoDisplay');
      
      if (withPhotoFade) {
        photoEl.classList.add('fade-anim');
        setTimeout(() => {
          photoEl.src = currentData.photo;
          photoEl.onload = () => {
            photoEl.classList.remove('fade-anim');
          };
        }, 300);
      } else {
        photoEl.src = currentData.photo;
      }
    }

    function updateCounter() {
      const counterEl = document.getElementById('counterIndicator');
      if (participants.length > 0) {
        counterEl.innerText = `${currentIndex + 1} / ${participants.length}`;
      } else {
        counterEl.innerText = `0 / 0`;
      }
    }

    function updateDisplay() {
      if (isTransitioning || participants.length === 0) return;
      isTransitioning = true;

      participantCard.classList.remove('show');

      setTimeout(() => {
        updateCardContent(true);
        updateCounter();
        participantCard.classList.add('show');

        setTimeout(() => {
          isTransitioning = false;
        }, 600);
      }, 600);
    }

    function nextParticipant() { 
      if (participants.length === 0) return;
      currentIndex = (currentIndex + 1) % participants.length; 
      updateDisplay(); 
    }

    function prevParticipant() { 
      if (participants.length === 0) return;
      currentIndex = (currentIndex - 1 + participants.length) % participants.length; 
      updateDisplay(); 
    }

    function toggleAutoPlay() {
      const btn = document.getElementById('btnAutoToggle');
      if (!isAutoPlaying) {
        isAutoPlaying = true;
        btn.innerText = "⏸ Jeda Otomatis";
        btn.style.background = "#b8860b";
        autoPlayTimer = setInterval(() => {
          nextParticipant();
        }, 5000);
      } else {
        stopAutoPlay();
      }
    }

    function stopAutoPlay() {
      isAutoPlaying = false;
      const btn = document.getElementById('btnAutoToggle');
      if (btn) {
        btn.innerText = "▶ Play Otomatis";
        btn.style.background = "linear-gradient(135deg, #d4af37, #997413)";
      }
      if (autoPlayTimer) {
        clearInterval(autoPlayTimer);
        autoPlayTimer = null;
      }
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowRight') {
        nextParticipant();
      } else if (event.key === 'ArrowLeft') {
        prevParticipant();
      }
    });

    fetchSecureSpreadsheetData();
  </script>

</body>
</html>
