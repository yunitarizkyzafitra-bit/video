<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasyakuran Dirosa Angkatan IX</title>
  
  <!-- Font Islami & Elegan -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;600;700&display=swap">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    /* Background Panggung Utama */
    .stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('./background.jpg');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* Memindahkan kartu ke area bawah agar judul Angkatan IX tidak tertutup */
      align-items: center;
      padding-bottom: 90px;
    }

    /* Card Digital Peserta */
    .display-card {
      position: relative;
      z-index: 2;
      width: 85%;
      max-width: 780px;
      padding: 20px 30px;
      display: flex;
      align-items: center;
      gap: 25px;
      
      /* Styling Mewah Glassmorphism */
      background: rgba(10, 25, 18, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2px solid #d4af37;
      border-radius: 20px;
      
      /* Efek Bayangan & Glow Emas */
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.6),
        0 0 25px rgba(212, 175, 55, 0.35),
        inset 0 0 15px rgba(212, 175, 55, 0.15);

      /* Animasi Transisi */
      animation: fadeInSlide 0.8s ease-out forwards;
    }

    /* Frame Foto Peserta */
    .photo-container {
      flex-shrink: 0;
      width: 120px;
      height: 150px;
      border-radius: 12px;
      border: 2px solid #d4af37;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      background: #0d231a;
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Informasi Teks Peserta */
    .info-container {
      flex-grow: 1;
      text-align: left;
    }

    .info-container .sub-title {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      letter-spacing: 2px;
      color: #f3e5ab;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .info-container .participant-name {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.8), 0 0 12px rgba(255, 215, 0, 0.3);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .info-container .participant-detail {
      font-size: 1rem;
      color: #d4af37;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* Tombol Navigasi Kontrol */
    .controls-container {
      position: absolute;
      bottom: 25px;
      z-index: 2;
      display: flex;
      gap: 12px;
    }

    .btn-control {
      background: rgba(15, 35, 25, 0.85);
      border: 1.5px solid #d4af37;
      color: #fff;
      padding: 8px 22px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .btn-control:hover {
      background: #d4af37;
      color: #0d231a;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
      transform: translateY(-2px);
    }

    /* Keyframes Animasi Pemanggilan */
    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="stage-container">

    <!-- Card Pemanggilan Nama Peserta -->
    <div class="display-card" id="participantCard">
      <!-- Bingkai Foto Peserta -->
      <div class="photo-container">
        <img id="photoDisplay" src="https://via.placeholder.com/150x200" alt="Foto Peserta">
      </div>

      <!-- Detail Teks -->
      <div class="info-container">
        <div class="sub-title">Peserta Tasyakuran</div>
        <div class="participant-name" id="nameDisplay">Fulanah Binti Fulan</div>
        <div class="participant-detail" id="detailDisplay">Kecamatan Palu Selatan</div>
      </div>
    </div>

    <!-- Kontrol Tombol Navigasi -->
    <div class="controls-container">
      <button class="btn-control" onclick="prevParticipant()">‹ Prev</button>
      <button class="btn-control" onclick="togglePause()">Pause</button>
      <button class="btn-control" onclick="nextParticipant()">Next ›</button>
    </div>

  </div>

  <script>
    // Data Peserta beserta foto masing-masing
    const participants = [
      { 
        name: "Fulanah Binti Fulan", 
        detail: "Kecamatan Palu Selatan", 
        photo: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=300" 
      },
      { 
        name: "Aisyah Az-Zahra", 
        detail: "Kecamatan Palu Barat", 
        photo: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=300" 
      },
      { 
        name: "Khadijah Al-Kubra", 
        detail: "Kecamatan Mantikulore", 
        photo: "https://images.unsplash.com/photo-1580489944761-15a19d654956?w=300" 
      }
    ];

    let currentIndex = 0;

    function updateDisplay() {
      const card = document.getElementById('participantCard');
      const nameEl = document.getElementById('nameDisplay');
      const detailEl = document.getElementById('detailDisplay');
      const photoEl = document.getElementById('photoDisplay');

      // Reset Animasi
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = 'fadeInSlide 0.8s ease-out forwards';

      // Update Isi
      nameEl.innerText = participants[currentIndex].name;
      detailEl.innerText = participants[currentIndex].detail;
      photoEl.src = participants[currentIndex].photo;
    }

    function nextParticipant() {
      currentIndex = (currentIndex + 1) % participants.length;
      updateDisplay();
    }

    function prevParticipant() {
      currentIndex = (currentIndex - 1 + participants.length) % participants.length;
      updateDisplay();
    }

    function togglePause() {
      alert("Autoplay dijeda.");
    }

    // Inisialisasi awal
    updateDisplay();
  </script>

</body>
</html>
