<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasyakuran Dirosa Angkatan IX - Display Panggung</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap">

  <style>
    :root {
      --gold-main: #D4AF37;
      --gold-light: #F3E5AB;
      --bg-dark-green: rgba(5, 18, 12, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #000;
    }

    /* 1. LAYAR UTAMA AWAL (PERIZINAN AUTOPLAY) */
    .start-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 3000;
      background: radial-gradient(circle, #08291b 0%, #020d08 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      transition: opacity 1s ease, visibility 1s ease;
    }

    .start-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .start-screen h1 {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 2.2rem;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
      text-align: center;
    }

    .btn-start-event {
      background: linear-gradient(135deg, #d4af37, #997413);
      border: 2px solid #fff;
      color: #041B12;
      padding: 18px 45px;
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .btn-start-event:hover {
      transform: scale(1.06);
      box-shadow: 0 0 45px rgba(212, 175, 55, 1);
    }

    /* 2. OVERLAY VIDEO OPENING */
    .intro-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 2000;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 1;
      visibility: visible;
      transition: opacity 1.5s cubic-bezier(0.25, 1, 0.5, 1), visibility 1.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-skip {
      position: absolute;
      bottom: 35px; right: 35px;
      z-index: 2010;
      background: rgba(5, 18, 12, 0.85);
      border: 1.5px solid var(--gold-main);
      color: #fff;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.4s ease;
    }

    .btn-skip:hover {
      background: var(--gold-main);
      color: #041B12;
    }

    /* 3. PANGGUNG DISPLAY UTAMA */
    .stage-container {
      position: relative;
      width: 100vw; height: 100vh;
      background-image: url('./background.jpg');
      background-position: center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* KARTU DENGAN TRANSISI HALUS & ELEGAN */
    .display-card {
      position: relative;
      z-index: 10;
      width: 68vw; max-width: 950px; min-height: 480px;
      padding: 35px 45px;
      display: flex; flex-direction: column; justify-content: center; gap: 20px;
      background: var(--bg-dark-green); 
      backdrop-filter: blur(20px);
      border: 3px solid var(--gold-main);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 35px rgba(212, 175, 55, 0.4);
      
      /* Animasi Halus (Smooth) */
      opacity: 0;
      transform: translateY(35px) scale(0.95);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .display-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .glass-header {
      align-self: center;
      padding: 10px 40px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(212, 175, 55, 0.6);
      border-radius: 35px;
    }

    .glass-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      letter-spacing: 5px;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .card-body {
      display: flex;
      align-items: center;
      gap: 35px;
    }

    .photo-container {
      flex-shrink: 0;
      width: 170px; height: 220px;
      border-radius: 18px;
      border: 3px solid var(--gold-main);
      overflow: hidden;
      background: #0d231a;
      transition: opacity 0.8s ease;
    }

    .photo-container img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .info-container {
      flex-grow: 1;
      display: flex; flex-direction: column; gap: 10px;
      transition: opacity 0.8s ease;
    }

    .info-box .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold-main);
      font-weight: 600;
    }

    .info-box .value-liqo { font-size: 1.25rem; font-weight: 600; color: #e0e0e0; }
    .info-box .value-mudarissah { font-size: 1.3rem; font-weight: 600; color: var(--gold-light); }
    .info-box .value-peserta {
      font-family: 'Cinzel', serif;
      font-size: 2.6rem; font-weight: 800; color: #ffffff;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9);
    }

    .controls-container {
      position: absolute; bottom: 25px;
      display: flex; gap: 15px;
    }

    .btn-control {
      background: rgba(12, 30, 22, 0.9);
      border: 1.5px solid var(--gold-main);
      color: #fff;
      padding: 10px 28px;
      font-size: 0.9rem; font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-control:hover {
      background: var(--gold-main);
      color: #041B12;
    }
  </style>
</head>
<body>

  <!-- TOMBOL AWAL PERIZINAN MEDIA -->
  <div class="start-screen" id="startScreen">
    <h1>TASYAKURAN DIROSA IX</h1>
    <button class="btn-start-event" onclick="startEvent()">🎬 MULAI OPENING CEREMONY</button>
  </div>

  <!-- OVERLAY PEMUTAR VIDEO OPENING -->
  <div class="intro-overlay" id="introOverlay">
    <video class="intro-video" id="introVideo" playsinline preload="auto">
      <source src="opening.mp4" type="video/mp4">
    </video>
    <button class="btn-skip" onclick="finishIntro()">Lewati Opening ›</button>
  </div>

  <!-- DISPLAY UTAMA PANGGUNG -->
  <div class="stage-container">
    <div class="display-card" id="participantCard">
      <div class="glass-header"><h2>Tasyakuran Dirosa</h2></div>
      <div class="card-body">
        <div class="photo-container"><img id="photoDisplay" src="https://via.placeholder.com/170x220" alt="Foto"></div>
        <div class="info-container">
          <div class="info-box"><div class="label">Kelompok / Liqo</div><div class="value-liqo" id="liqoDisplay">-</div></div>
          <div class="info-box"><div class="label">Mudarissah</div><div class="value-mudarissah" id="mudarissahDisplay">-</div></div>
          <div class="info-box"><div class="label">Nama Peserta</div><div class="value-peserta" id="pesertaDisplay">Siap Dipanggil...</div></div>
        </div>
      </div>
    </div>

    <!-- TOMBOL KONTROL -->
    <div class="controls-container">
      <button class="btn-control" onclick="prevParticipant()">‹ Sebelum</button>
      <button class="btn-control" onclick="replayIntro()">🎥 Putar Ulang Video Opening</button>
      <button class="btn-control" onclick="nextParticipant()">Selanjutnya ›</button>
    </div>
  </div>

  <script>
    const startScreen = document.getElementById('startScreen');
    const introOverlay = document.getElementById('introOverlay');
    const introVideo = document.getElementById('introVideo');
    const participantCard = document.getElementById('participantCard');

    function startEvent() {
      startScreen.classList.add('fade-out');
      introVideo.currentTime = 0;

      const playPromise = introVideo.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.warn("Autoplay ditolak, memutar tanpa suara:", error);
          introVideo.muted = true;
          introVideo.play();
        });
      }
    }

    introVideo.addEventListener('ended', finishIntro);

    introVideo.addEventListener('error', function(e) {
      console.error("Video error:", e);
      alert("Video tidak dapat dimuat. Membuka langsung panggung utama.");
      finishIntro();
    });

    function finishIntro() {
      introOverlay.classList.add('hidden');
      setTimeout(() => introVideo.pause(), 1200);
      
      // Delay sedikit sebelum menampilkan kartu agar masa transisi sangat halus
      setTimeout(() => {
        participantCard.classList.add('show');
      }, 400);
    }

    function replayIntro() {
      participantCard.classList.remove('show');
      
      setTimeout(() => {
        introOverlay.classList.remove('hidden');
        introVideo.currentTime = 0;
        introVideo.play();
      }, 600);
    }

    // Data Peserta
    const participants = [
      { liqo: "AL-ALAQ 9.PB4", mudarissah: "EPA NURMALA", peserta: "Riska Rahayu, A.md.Kep", photo: "https://via.placeholder.com/170x220" },
      { liqo: "AL-ALAQ 9.PB4", mudarissah: "EPA NURMALA", peserta: "Anisya Ismail, A.md.Kep", photo: "https://via.placeholder.com/170x220" },
      { liqo: "AL-ALAQ 9.PB4", mudarissah: "EPA NURMALA", peserta: "Endang Sudariyaningsih", photo: "https://via.placeholder.com/170x220" }
    ];

    let currentIndex = 0;
    let isTransitioning = false;

    // FUNGSI UPDATE PERGANTIAN DENGAN TRANSISI HALUS DAN MANTAP
    function updateDisplay() {
      if (isTransitioning) return;
      isTransitioning = true;

      // 1. Redupkan / hilangkan kartu secara perlahan
      participantCard.classList.remove('show');

      // 2. Tunggu 600ms (pas di tengah durasi animasi hilangnya kartu)
      setTimeout(() => {
        document.getElementById('liqoDisplay').innerText = participants[currentIndex].liqo;
        document.getElementById('mudarissahDisplay').innerText = participants[currentIndex].mudarissah;
        document.getElementById('pesertaDisplay').innerText = participants[currentIndex].peserta;
        document.getElementById('photoDisplay').src = participants[currentIndex].photo;

        // 3. Munculkan kembali kartu secara perlahan dengan efek membal mulus
        participantCard.classList.add('show');
        
        setTimeout(() => {
          isTransitioning = false;
        }, 600);
      }, 600);
    }

    function nextParticipant() { 
      currentIndex = (currentIndex + 1) % participants.length; 
      updateDisplay(); 
    }

    function prevParticipant() { 
      currentIndex = (currentIndex - 1 + participants.length) % participants.length; 
      updateDisplay(); 
    }

    // Inisialisasi awal
    document.getElementById('liqoDisplay').innerText = participants[0].liqo;
    document.getElementById('mudarissahDisplay').innerText = participants[0].mudarissah;
    document.getElementById('pesertaDisplay').innerText = participants[0].peserta;
  </script>

</body>
</html>
