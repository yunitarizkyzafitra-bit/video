<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-PAD 2026 — CIKASDA Sulawesi Tengah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#061225;
    --navy:#0B2A5E;
    --blue:#164A8C;
    --blue-light:#2E7BD6;
    --gold:#E3A730;
    --gold-light:#F3C765;
    --green:#16A672;
    --purple:#6C4FD1;
    --teal:#14947A;
    --cyan:#17AECD;
    --orange:#D9772E;
    --ink:#EAF0FB;
    --ink-dim:#8FA6CC;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(227,167,48,0.28);
    --neon-cyan:#00E5C7;
    --neon-yellow:#FFD23F;
    --neon-coral:#FF6B6B;
    --accent-glow:0 0 22px rgba(0,229,199,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(46,123,214,0.22), transparent 55%),
      radial-gradient(ellipse at 85% 110%, rgba(227,167,48,0.10), transparent 50%),
      linear-gradient(180deg, var(--navy-deep), var(--navy) 55%, #08152E 100%);
    color:var(--ink);
    overflow:hidden;
    height:100vh;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(143,166,204,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(143,166,204,0.05) 1px, transparent 1px);
    background-size:42px 42px;
    pointer-events:none;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    z-index:0;
  }

  .stage{ position:relative; width:100%; height:100vh; z-index:1; }

  .scene{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:56px 24px 130px;
    opacity:0; visibility:hidden; transform:translateY(26px) scale(0.97);
    transition:opacity .65s cubic-bezier(.22,.9,.32,1), transform .65s cubic-bezier(.22,.9,.32,1), visibility 0s .65s;
    text-align:center;
  }
  .scene.active{
    opacity:1; visibility:visible; transform:translateY(0) scale(1);
    transition:opacity .65s cubic-bezier(.22,.9,.32,1), transform .65s cubic-bezier(.22,.9,.32,1), visibility 0s;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace; letter-spacing:.22em; text-transform:uppercase;
    font-size:11px; color:var(--gold); margin-bottom:14px; opacity:0;
  }
  .active .eyebrow{ animation: rise .6s ease .1s forwards; }

  h1.title{
    font-family:'Sora',sans-serif; font-weight:800;
    font-size:clamp(26px, 4.6vw, 46px); letter-spacing:-0.01em; line-height:1.1;
    color:#fff;
  }
  h2.scene-title{
    font-family:'Sora',sans-serif; font-weight:700;
    font-size:clamp(22px, 3.1vw, 32px); margin-bottom:8px; opacity:0;
    max-width:900px; margin-left:auto; margin-right:auto;
  }
  h2.scene-title.long{ font-size:clamp(18px, 2.3vw, 25px); line-height:1.35; max-width:820px; }
  .active h2.scene-title{ animation: rise .6s ease .15s forwards; }

  .sub{ color:var(--ink-dim); font-size:clamp(13px,1.5vw,16px); max-width:600px; margin:0 auto; opacity:0; }
  .active .sub{ animation: rise .6s ease .25s forwards; }

  @keyframes rise{ from{opacity:0; transform:translateY(14px) scale(0.97);} to{opacity:1; transform:translateY(0) scale(1);} }

  /* ---------- SCENE COVER : POSTER RESMI ---------- */
  .cover-frame{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .cover-img{
    max-width:92%; max-height:88%; width:auto; height:auto;
    object-fit:contain; border-radius:6px;
    box-shadow:0 25px 70px rgba(0,0,0,0.55);
    opacity:0; transform:scale(1.06);
  }
  /* TAMBAHAN ANIMASI FLOATING SETELAH COVER MUNCUL */
  .active .cover-img{ animation: coverIn 1.8s ease forwards, floatAnim 4s ease-in-out 1.8s infinite; }
  @keyframes coverIn{ from{ opacity:0; transform:scale(1.08); } to{ opacity:1; transform:scale(1); } }
  @keyframes floatAnim{ 
    0%, 100%{ transform:translateY(0) scale(1); } 
    50%{ transform:translateY(-12px) scale(1.015); } 
  }
  
  .cover-caption{
    position:absolute; bottom:22px; left:0; right:0; text-align:center;
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-dim); opacity:0;
  }
  .active .cover-caption{ animation: rise .6s ease 1.6s forwards; }

  /* ---------- SCENE 1 : HERO GEDUNG ---------- */
  #s1{ padding:0; }
  .hero{
    position:relative; width:100%; height:100%;
    display:flex; align-items:flex-end; justify-content:flex-start;
    overflow:hidden;
  }
  .hero img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:saturate(1.05);
    transform:scale(1.06);
    opacity:0;
  }
  .active .hero img{ animation: heroZoom 9s ease forwards; }
  @keyframes heroZoom{ from{opacity:0; transform:scale(1.12);} 8%{opacity:1;} to{opacity:1; transform:scale(1.0);} }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(6,18,37,0.55) 0%, rgba(6,18,37,0.55) 30%, rgba(6,18,37,0.92) 100%);
  }
  .hero-content{
    position:relative; z-index:2;
    padding:40px clamp(20px,6vw,72px) 56px;
    text-align:left; width:100%;
  }
  .badges{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; opacity:0; }
  .active .badges{ animation: rise .6s ease .3s forwards; }
  .badge-gold{
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    color:var(--navy-deep); font-family:'JetBrains Mono',monospace; font-weight:700;
    font-size:11px; letter-spacing:.05em; padding:7px 12px; border-radius:6px;
  }
  .badge-status{
    display:flex; align-items:center; gap:6px;
    background:rgba(20,148,122,0.25); border:1px solid rgba(22,166,114,0.5);
    color:#7CF0C4; font-family:'JetBrains Mono',monospace; font-size:11px;
    padding:7px 12px; border-radius:999px;
  }
  .badge-status .dot{ width:6px; height:6px; border-radius:50%; background:#39E29B; box-shadow:0 0 8px #39E29B; }
  #s1 .instansi-sub{
    font-family:'Inter',sans-serif; font-weight:600;
    font-size:clamp(13px,1.7vw,17px); color:var(--gold-light);
    margin-top:12px; opacity:0; text-align:left;
    border-left:3px solid var(--gold); padding-left:10px;
  }
  .active #s1 .instansi-sub{ animation: rise .6s ease .38s forwards; }
  #s1 .title{ text-align:left; max-width:780px; font-size:clamp(17px, 2.5vw, 25px); line-height:1.4; font-weight:700; opacity:0; }
  .active #s1 .title{ animation: rise .6s ease .3s forwards; }
  #s1 .title .proj-prefix{ color:var(--gold-light); font-weight:800; }
  #s1 .title .paren{ font-weight:400; color:var(--ink-dim); font-size:0.9em; }
  #s1 .sub-row{
    display:flex; align-items:center; gap:8px; margin-top:16px;
    font-size:13.5px; color:var(--ink-dim); opacity:0;
  }
  .active #s1 .sub-row{ animation: rise .6s ease .65s forwards; }
  #s1 .cover-desc{
    text-align:left; max-width:700px; margin-top:14px;
    font-size:clamp(12.5px,1.45vw,15px); line-height:1.55; color:var(--ink-dim);
    font-weight:500; opacity:0;
  }
  .active #s1 .cover-desc{ animation: rise .6s ease .52s forwards; }
  #s1 .foot{ margin-top:16px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold-light); opacity:0; }
  .active #s1 .foot{ animation: rise .6s ease .8s forwards; }

  /* ---------- SCENE TENTANG APLIKASI M-PAD ---------- */
  .feature-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:20px; max-width:720px;
  }
  .feature-card{
    background:linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--card-border); border-radius:12px;
    padding:18px 16px; text-align:left; opacity:0; transform:translateY(16px) scale(0.94);
  }
  .active .feature-card{ animation: cardIn .55s cubic-bezier(.22,.9,.32,1) forwards; }
  .active .feature-card.f1{ animation-delay:.2s; }
  .active .feature-card.f2{ animation-delay:.42s; }
  .active .feature-card.f3{ animation-delay:.64s; }
  .active .feature-card.f4{ animation-delay:.86s; }
  .feature-icon{
    width:40px; height:40px; border-radius:10px;
    background:rgba(0,229,199,0.12); border:1px solid rgba(0,229,199,0.4);
    display:flex; align-items:center; justify-content:center; font-size:18px;
    margin-bottom:11px; opacity:0; transform:scale(0.5);
  }
  .active .feature-card.f1 .feature-icon{ animation: iconPop .5s cubic-bezier(.34,1.56,.64,1) .45s forwards; }
  .active .feature-card.f2 .feature-icon{ animation: iconPop .5s cubic-bezier(.34,1.56,.64,1) .67s forwards; }
  .active .feature-card.f3 .feature-icon{ animation: iconPop .5s cubic-bezier(.34,1.56,.64,1) .89s forwards; }
  .active .feature-card.f4 .feature-icon{ animation: iconPop .5s cubic-bezier(.34,1.56,.64,1) 1.11s forwards; }
  .feature-card b{ display:block; font-family:'Sora',sans-serif; font-size:14px; margin-bottom:5px; color:#fff; }
  .feature-card p{ font-size:12px; color:var(--ink-dim); line-height:1.55; margin:0; }
  .app-name-badge{
    display:inline-flex; align-items:baseline; gap:8px; margin-bottom:6px; opacity:0;
  }
  .active .app-name-badge{ animation: rise .6s cubic-bezier(.22,.9,.32,1) .05s forwards; }
  .app-name-badge .big{ font-family:'Sora',sans-serif; font-weight:800; font-size:clamp(26px,4vw,38px); color:var(--neon-cyan); text-shadow:0 0 20px rgba(0,229,199,0.35); }
  .app-name-badge .small{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); }

  /* ---------- SCENE 2 : TOTAL KAS ---------- */
  .big-num{
    font-family:'Sora',sans-serif; font-weight:800;
    font-size:clamp(40px, 8vw, 78px);
    background:linear-gradient(180deg, #FFFFFF, #C7D6EF);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:8px 0 18px;
    filter:drop-shadow(0 0 24px rgba(0,229,199,0.25));
  }
  .stat-row{
    display:flex; gap:28px; flex-wrap:wrap; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-dim);
    margin-bottom:22px; opacity:0;
  }
  .active .stat-row{ animation: rise .6s ease .55s forwards; }
  .stat-row b{ color:var(--gold-light); font-size:15px; }
  .achieve-badge{
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(0,229,199,0.14); border:1px solid rgba(0,229,199,0.55);
    color:var(--neon-cyan); padding:8px 18px; border-radius:999px;
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700;
    box-shadow:var(--accent-glow);
    opacity:0;
  }
  .active .achieve-badge{ animation: rise .6s ease .75s forwards; }

  .split-bar{
    width:100%; max-width:480px; height:14px; border-radius:8px;
    background:rgba(255,255,255,0.08); margin-top:26px; overflow:hidden;
    display:flex; opacity:0;
  }
  .active .split-bar{ animation: rise .5s ease .95s forwards; }
  .split-bar .tunai{ height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-light)); width:0; }
  .split-bar .nontunai{ height:100%; background:linear-gradient(90deg, var(--blue-light), var(--blue)); width:0; }
  .active .split-bar .tunai{ animation: growW 1.4s ease 1.1s forwards; }
  .active .split-bar .nontunai{ animation: growW2 1.4s ease 1.1s forwards; }
  @keyframes growW{ to{ width:23.6%; } }
  @keyframes growW2{ to{ width:76.4%; } }
  .split-legend{
    display:flex; gap:22px; margin-top:12px; font-size:12px; color:var(--ink-dim);
    font-family:'JetBrains Mono',monospace; opacity:0;
  }
  .active .split-legend{ animation: rise .5s ease 1.3s forwards; }
  .split-legend span::before{
    content:""; display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px;
  }
  .split-legend .lg1::before{ background:var(--gold); }
  .split-legend .lg2::before{ background:var(--blue-light); }

  /* ---------- SIKLUS PENYEWA -> KAS DAERAH ---------- */
  .cycle-wrap{ width:100%; max-width:820px; margin-top:14px; }
  .cycle-row{ display:flex; align-items:flex-start; justify-content:center; gap:4px; flex-wrap:wrap; }
  .cyc-node{ width:150px; display:flex; flex-direction:column; align-items:center; text-align:center; opacity:0; transform:translateY(14px) scale(0.94); }
  .active .cyc-node{ animation: cardIn .5s ease forwards; }
  .active .cyc-node.n1{ animation-delay:.15s; }
  .active .cyc-node.n2{ animation-delay:.55s; }
  .active .cyc-node.n3{ animation-delay:.95s; }
  .active .cyc-node.n4{ animation-delay:1.35s; }
  .cyc-icon{
    width:52px; height:52px; border-radius:50%;
    background:linear-gradient(160deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--card-border); display:flex; align-items:center; justify-content:center;
    font-size:22px; margin-bottom:9px;
    opacity:0; transform:scale(0.4) rotate(-18deg);
  }
  .active .cyc-node.n1 .cyc-icon{ animation: iconPop .55s cubic-bezier(.34,1.56,.64,1) .32s forwards; }
  .active .cyc-node.n2 .cyc-icon{ animation: iconPop .55s cubic-bezier(.34,1.56,.64,1) .72s forwards; }
  .active .cyc-node.n3 .cyc-icon{ animation: iconPop .55s cubic-bezier(.34,1.56,.64,1) 1.12s forwards; }
  .active .cyc-node.n4 .cyc-icon{ animation: iconPop .55s cubic-bezier(.34,1.56,.64,1) 1.52s forwards; }
  @keyframes iconPop{
    0%{ opacity:0; transform:scale(0.4) rotate(-18deg); }
    60%{ opacity:1; transform:scale(1.14) rotate(3deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  .cyc-label{ font-family:'Sora',sans-serif; font-weight:700; font-size:13px; color:#fff; margin-bottom:4px; }
  .cyc-desc{ font-size:11px; color:var(--ink-dim); line-height:1.45; }
  .cyc-arrow{ align-self:center; color:var(--gold); font-size:20px; opacity:0; margin-top:18px; }
  .active .cyc-arrow{ animation: rise .5s ease forwards; }
  .active .cyc-arrow.a1{ animation-delay:.4s; }
  .active .cyc-arrow.a2{ animation-delay:.8s; }
  .active .cyc-arrow.a3{ animation-delay:1.2s; }
  .cycle-track{
    position:relative; height:8px; max-width:760px; margin:30px auto 0;
    background:rgba(255,255,255,0.07); border-radius:4px; overflow:hidden;
  }
  .coin-travel{
    position:absolute; top:50%; left:0; width:10px; height:10px; margin-top:-5px;
    border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold));
    box-shadow:0 0 8px rgba(227,167,48,.6); opacity:0;
  }
  .active .coin-travel{ animation: travel 3.4s linear infinite; }
  .coin-travel.c1{ animation-delay:.3s !important; }
  .coin-travel.c2{ animation-delay:1.4s !important; }
  .coin-travel.c3{ animation-delay:2.5s !important; }
  @keyframes travel{
    0%{ left:0%; opacity:0; }
    6%{ opacity:1; }
    94%{ opacity:1; }
    100%{ left:100%; opacity:0; }
  }
  .cycle-caption{
    margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim);
  }

  /* ---------- SCENE 3 : KATEGORI SEWA ---------- */
  .cat-grid{
    display:grid; grid-template-columns:repeat(4, 150px); gap:12px;
    margin-top:18px; max-width:700px;
  }
  .cat-card{
    background:linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--card-border); border-radius:12px;
    padding:14px 12px; text-align:left; opacity:0; transform:translateY(14px) scale(0.94);
    border-top:3px solid var(--c, var(--gold));
  }
  .active .cat-card{ animation: cardIn .5s ease forwards; }
  .active .cat-card:nth-child(1){ animation-delay:.1s; }
  .active .cat-card:nth-child(2){ animation-delay:.2s; }
  .active .cat-card:nth-child(3){ animation-delay:.3s; }
  .active .cat-card:nth-child(4){ animation-delay:.4s; }
  .active .cat-card:nth-child(5){ animation-delay:.5s; }
  .active .cat-card:nth-child(6){ animation-delay:.6s; }
  .active .cat-card:nth-child(7){ animation-delay:.7s; }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0) scale(1);} }
  .cat-card .cname{ font-size:10.5px; font-weight:600; color:var(--ink-dim); letter-spacing:.03em; margin-bottom:6px; }
  .cat-card .cval{ font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; color:#fff; }
  .cat-card .cpct{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--gold-light); margin-top:2px; }
  .cat-card .cbar{ width:100%; height:5px; background:rgba(255,255,255,0.12); border-radius:3px; margin-top:8px; overflow:hidden; }
  .cat-card .cbar i{ display:block; height:100%; width:0; background:var(--c, var(--gold)); box-shadow:0 0 6px var(--c, var(--gold)); }
  .active .cat-card .cbar i{ animation: fillbar 1s ease .8s forwards; }
  .cat-card .ctarget{ font-size:9.5px; color:var(--ink-dim); margin-top:5px; font-family:'JetBrains Mono',monospace; }
  @keyframes fillbar{ to{ width:var(--w, 0%); } }

  /* ---------- SCENE 4 : GRAFIK FLUKTUASI ---------- */
  .chart-box{ width:100%; max-width:820px; margin-top:10px; position:relative; padding:14px; }

  /* ---------- BADGE KACA — SOROTAN KENAIKAN TERTINGGI DI GRAFIK ---------- */
  .glass-highlight{
    position:absolute; left:57%; top:0%; transform:translate(-50%,-92%);
    background:linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.3); border-radius:12px;
    padding:9px 16px; text-align:center; white-space:nowrap;
    box-shadow:0 12px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    opacity:0;
  }
  .active .glass-highlight{ animation: rise .6s cubic-bezier(.22,.9,.32,1) 1.9s forwards; }
  .glass-highlight .gh-label{
    display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--neon-coral); margin-bottom:2px;
  }
  .glass-highlight .gh-value{
    display:block; font-family:'Sora',sans-serif; font-weight:700; font-size:15px; color:#fff;
  }
  .chart-box svg{ width:100%; height:auto; overflow:visible; }
  .chart-box::before, .chart-box::after,
  .chart-corner-tl, .chart-corner-tr, .chart-corner-bl, .chart-corner-br{
    content:""; position:absolute; width:22px; height:22px;
    border-color:var(--neon-cyan); opacity:0; pointer-events:none;
  }
  .active .chart-box::before, .active .chart-box::after,
  .active .chart-corner-tl, .active .chart-corner-tr, .active .chart-corner-bl, .active .chart-corner-br{
    animation: rise .5s ease .1s forwards;
  }
  .chart-box::before{ top:0; left:0; border-top:2px solid var(--neon-cyan); border-left:2px solid var(--neon-cyan); }
  .chart-box::after{ top:0; right:0; border-top:2px solid var(--neon-cyan); border-right:2px solid var(--neon-cyan); }
  .chart-corner-bl{ bottom:0; left:0; border-bottom:2px solid var(--neon-cyan); border-left:2px solid var(--neon-cyan); }
  .chart-corner-br{ bottom:0; right:0; border-bottom:2px solid var(--neon-cyan); border-right:2px solid var(--neon-cyan); }
  .path-line{
    fill:none; stroke:var(--navy); stroke-width:3;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:2000; stroke-dashoffset:2000;
  }
  .path-line.solid{ stroke:var(--neon-cyan); filter:drop-shadow(0 0 6px rgba(0,229,199,0.85)); }
  .active .path-line{ animation: draw 2.1s ease .3s forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .path-area{ fill:url(#areaGrad); opacity:0; }
  .active .path-area{ animation: rise 1s ease 1.6s forwards; }
  .chart-dot{ opacity:0; }
  .active .chart-dot{ animation: dotPop .4s ease forwards; }
  .month-lbl{ font-family:'JetBrains Mono',monospace; font-size:11px; fill:var(--ink-dim); }
  .axis-lbl{ font-family:'JetBrains Mono',monospace; font-size:10px; fill:var(--ink-dim); }
  @keyframes dotPop{ from{ opacity:0; transform:scale(0);} to{ opacity:1; transform:scale(1);} }
  .chart-scan{ opacity:0; }
  .active .chart-scan{ animation: scanSweep 3s linear .5s 1, rise .3s ease .5s forwards; }
  @keyframes scanSweep{ from{ transform:translateX(0); } to{ transform:translateX(920px); } }

  /* ---------- SCENE 5 : INSIGHT ---------- */
  .insight-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px; max-width:720px;
  }
  .insight-card{
    background:linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--card-border); border-radius:12px;
    padding:16px 16px; text-align:left; opacity:0; transform:translateY(14px) scale(0.94);
    font-size:13px; line-height:1.5; color:var(--ink-dim);
  }
  .insight-card b{ color:#fff; display:block; margin-bottom:5px; font-family:'Sora',sans-serif; font-size:14px; }
  .active .insight-card{ animation: cardIn .55s ease forwards; }
  .active .insight-card:nth-child(1){ animation-delay:.15s; }
  .active .insight-card:nth-child(2){ animation-delay:.35s; }
  .active .insight-card:nth-child(3){ animation-delay:.55s; }
  .active .insight-card:nth-child(4){ animation-delay:.75s; }

  /* ---------- SCENE 6 : RINGKASAN KPI ---------- */
  .kpi-grid{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin-top:18px; max-width:760px; }
  .gauge-wrap{ width:148px; margin:2px auto 6px; }
  .gauge-svg{ width:148px; height:148px; filter:drop-shadow(0 0 12px rgba(0,229,199,0.45)); opacity:0; transform:scale(0.9); }
  .active .gauge-svg{ animation: rise .6s ease .05s forwards; }
  .gauge-ring{ stroke-dasharray:414.7; stroke-dashoffset:414.7; }
  .active .gauge-ring{ animation: gaugeFill 1.7s cubic-bezier(.2,.8,.2,1) .25s forwards; }
  @keyframes gaugeFill{ to{ stroke-dashoffset:0; } }
  .gauge-num{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:23px; fill:#fff; }
  .gauge-sub{ font-family:'JetBrains Mono',monospace; font-size:8.5px; fill:var(--ink-dim); letter-spacing:.06em; text-transform:uppercase; }
  .dash-row{ display:flex; align-items:center; justify-content:center; gap:22px; flex-wrap:wrap; margin-bottom:4px; }
  .spark-wrap{
    width:170px;
    background:linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--card-border); border-radius:12px;
    padding:12px 14px 10px; opacity:0; transform:translateY(14px) scale(0.94);
  }
  .active .spark-wrap{ animation: cardIn .55s ease .1s forwards; }
  .spark-title{ font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--ink-dim); letter-spacing:.05em; text-transform:uppercase; margin-bottom:8px; text-align:left; }
  .spark-bars{ display:flex; align-items:flex-end; gap:4px; height:44px; }
  .spark-bars i{
    flex:1; display:block; border-radius:2px 2px 0 0; height:0;
    background:linear-gradient(180deg, var(--neon-cyan), rgba(0,229,199,0.25));
  }
  .active .spark-bars i{ animation: sparkGrow .8s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes sparkGrow{ to{ height:var(--h); } }
  .kpi-card{
    width:165px;
    background:linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--card-border); border-radius:14px;
    padding:20px 14px; opacity:0; transform:translateY(16px) scale(0.94);
  }
  .active .kpi-card{ animation: cardIn .55s ease forwards; }
  .active .kpi-card.k1{ animation-delay:.15s; }
  .active .kpi-card.k2{ animation-delay:.35s; }
  .active .kpi-card.k3{ animation-delay:.55s; }
  .active .kpi-card.k4{ animation-delay:.75s; }
  .kpi-card .num{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; color:var(--neon-yellow); text-shadow:0 0 16px rgba(255,210,63,0.35); }
  .kpi-card .lbl{ font-size:11.5px; color:var(--ink-dim); margin-top:6px; line-height:1.4; }

  /* ---------- SCENE 7 : PENUTUP ---------- */
  #s7 .mini-hero{
    width:120px; height:120px; border-radius:16px; overflow:hidden;
    border:1px solid var(--card-border); margin:0 auto 18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  #s7 .mini-hero img{ width:100%; height:100%; object-fit:cover; }
  .pillars{ display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; justify-content:center; }
  .pillar{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-dim);
    border:1px solid var(--card-border); padding:6px 14px; border-radius:999px; opacity:0;
  }
  .active .pillar{ animation: rise .5s ease forwards; }
  .active .pillar.p1{ animation-delay:.2s; }
  .active .pillar.p2{ animation-delay:.4s; }
  .active .pillar.p3{ animation-delay:.6s; }
  .foot-org{ margin-top:16px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-dim); opacity:0; }
  .active .foot-org{ animation: rise .5s ease .3s forwards; }
  .replay-btn{
    margin-top:26px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--navy-deep);
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    border:none; padding:12px 22px; border-radius:999px; cursor:pointer; opacity:0; letter-spacing:.05em;
  }
  .active .replay-btn{ animation: rise .5s ease .9s forwards; }
  .replay-btn:hover{ filter:brightness(1.08); }

  /* ---------- CONTROLS ---------- */
  .controls{ position:fixed; left:0; right:0; bottom:24px; display:flex; flex-direction:column; align-items:center; gap:12px; z-index:5; }
  .dots{ display:flex; gap:8px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.18); cursor:pointer; position:relative; overflow:hidden; transition:background .3s; }
  .dot.active{ background:rgba(227,167,48,0.35); }
  .dot .fill{ position:absolute; inset:0; background:var(--gold); transform:scaleX(0); transform-origin:left; border-radius:50%; }
  .dot.active .fill{ animation: fillDot linear forwards; animation-duration: var(--dur, 6s); }
  @keyframes fillDot{ from{ transform:scaleX(0);} to{ transform:scaleX(1);} }
  .navbtns{ display:flex; gap:10px; align-items:center; }
  .navbtn{ width:32px; height:32px; border-radius:50%; border:1px solid var(--card-border); background:var(--card); color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .navbtn:hover{ background:rgba(255,255,255,0.1); }
  .navbtn.play{ width:auto; padding:0 15px; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.05em; }
  #narrateBtn{
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    color:var(--navy-deep); font-weight:700; border:none;
    animation: narratePulse 2s ease-in-out infinite;
  }
  #narrateBtn.is-on{ animation:none; background:rgba(0,229,199,0.18); color:var(--neon-cyan); border:1px solid rgba(0,229,199,0.5); }
  @keyframes narratePulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(227,167,48,0.55); }
    50%{ box-shadow:0 0 0 9px rgba(227,167,48,0); }
  }

  @media (max-width:640px){
    .cat-grid{ grid-template-columns:repeat(2, 145px); }
    .insight-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
