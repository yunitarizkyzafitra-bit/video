<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasyakuran Dirosa Angkatan IX - Display Panggung</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap">

  <style>
    :root {
      --gold-main: #D4AF37;
      --gold-light: #F3E5AB;
      --bg-dark-green: rgba(5, 18, 12, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #000;
    }

    /* 1. LAYAR OPENING UTAMA */
    .start-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 3000;
      background: radial-gradient(circle, #08291b 0%, #020d08 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }

    .start-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* WADAH KARTU UNTUK LOGO MWD */
    .logo-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--gold-main);
      border-radius: 24px;
      padding: 20px 35px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(212, 175, 55, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.6s ease;
    }

    .logo-card:hover {
      transform: scale(1.08);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 35px rgba(212, 175, 55, 0.6);
    }

    .logo-wahdah {
      width: 160px;
      height: auto;
      filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.5));
      transition: transform 0.5s ease;
    }

    .logo-card:hover .logo-wahdah {
      transform: scale(1.05);
    }

    .start-screen h1 {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 2.5rem;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
      text-align: center;
    }

    .btn-start-event {
      background: linear-gradient(135deg, #d4af37, #997413);
      border: 2px solid #fff;
      color: #041B12;
      padding: 18px 45px;
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .btn-start-event:hover {
      transform: scale(1.06);
      box-shadow: 0 0 45px rgba(212, 175, 55, 1);
    }

    /* 2. PANGGUNG DISPLAY UTAMA */
    .stage-container {
      position: relative;
      width: 100vw; height: 100vh;
      background-image: url('./background.jpg');
      background-position: center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .display-card {
      position: relative;
      z-index: 10;
      width: 68vw; max-width: 950px; min-height: 480px;
      padding: 35px 45px;
      display: flex; flex-direction: column; justify-content: center; gap: 20px;
      background: var(--bg-dark-green); 
      backdrop-filter: blur(20px);
      border: 3px solid var(--gold-main);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 35px rgba(212, 175, 55, 0.4);
      
      opacity: 0;
      transform: translateY(40px) scale(0.92);
      filter: blur(12px);
      transition: opacity 1.8s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 1.8s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 1.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform, filter;
    }

    .display-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0px);
    }

    .glass-header {
      align-self: center;
      padding: 10px 40px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(212, 175, 55, 0.6);
      border-radius: 35px;
    }

    .glass-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      letter-spacing: 5px;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .card-body {
      display: flex;
      align-items: center;
      gap: 35px;
    }

    .photo-container {
      flex-shrink: 0;
      width: 170px; height: 220px;
      border-radius: 18px;
      border: 3px solid var(--gold-main);
      overflow: hidden;
      background: #0d231a;
      transition: opacity 0.8s ease;
    }

    .photo-container img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .info-container {
      flex-grow: 1;
      display: flex; flex-direction: column; gap: 10px;
      transition: opacity 0.8s ease;
    }

    .info-box .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold-main);
      font-weight: 600;
    }

    .info-box .value-liqo { font-size: 1.25rem; font-weight: 600; color: #e0e0e0; }
    .info-box .value-mudarissah { font-size: 1.3rem; font-weight: 600; color: var(--gold-light); }
    .info-box .value-peserta {
      font-family: 'Cinzel', serif;
      font-size: 2.6rem; font-weight: 800; color: #ffffff;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9);
    }

    .controls-container {
      position: absolute; bottom: 25px;
      display: flex; gap: 15px;
    }

    .btn-control {
      background: rgba(12, 30, 22, 0.9);
      border: 1.5px solid var(--gold-main);
      color: #fff;
      padding: 10px 28px;
      font-size: 0.9rem; font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-control:hover {
      background: var(--gold-main);
      color: #041B12;
    }
  </style>
</head>
<body>

  <!-- LAYAR OPENING DEPAN -->
  <div class="start-screen" id="startScreen">
    <div class="logo-card">
      <img class="logo-wahdah" src="./logo MWD.png" alt="Logo MWD">
    </div>
    
    <h1>TASYAKURAN DIROSA IX</h1>
    <button class="btn-start-event" onclick="startEvent()">🎬 DIMULAI</button>
  </div>

  <!-- PANGGUNG DISPLAY UTAMA -->
  <div class="stage-container">
    <div class="display-card" id="participantCard">
      <div class="glass-header"><h2>Tasyakuran Dirosa</h2></div>
      <div class="card-body">
        <div class="photo-container"><img id="photoDisplay" src="https://via.placeholder.com/170x220" alt="Foto"></div>
        <div class="info-container">
          <div class="info-box"><div class="label">Kelompok / Liqo</div><div class="value-liqo" id="liqoDisplay">Memuat data...</div></div>
          <div class="info-box"><div class="label">Mudarissah</div><div class="value-mudarissah" id="mudarissahDisplay">Memuat data...</div></div>
          <div class="info-box"><div class="label">Nama Peserta</div><div class="value-peserta" id="pesertaDisplay">Menghubungkan Spreadsheet...</div></div>
        </div>
      </div>
    </div>

    <!-- KONTROL NAVIGASI -->
    <div class="controls-container">
      <button class="btn-control" onclick="prevParticipant()">‹ Sebelum</button>
      <button class="btn-control" onclick="showOpening()">🏠 Kembali ke Opening</button>
      <button class="btn-control" onclick="nextParticipant()">Selanjutnya ›</button>
    </div>
  </div>

  <script>
    const startScreen = document.getElementById('startScreen');
    const participantCard = document.getElementById('participantCard');

    // Link CSV otomatis dari spreadsheet Anda
    const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/18vOawlsXWX_PXjKoZQoPad2jj0klPVcGbXuxtF6Uh1k/export?format=csv&gid=886014663';

    let participants = [];
    let currentIndex = 0;
    let isTransitioning = false;

    // Fungsi otomatis menarik data dari Google Sheets (format CSV)
    async function fetchSpreadsheetData() {
      try {
        const response = await fetch(sheetCsvUrl);
        const data = await response.text();
        
        const rows = data.split('\n').slice(1); // Lewati header baris pertama
        participants = rows.map(row => {
          const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          return {
            liqo: cols[0]?.replace(/"/g, '').trim() || '-',
            mudarissah: cols[1]?.replace(/"/g, '').trim() || '-',
            peserta: cols[2]?.replace(/"/g, '').trim() || '-',
            photo: cols[3]?.replace(/"/g, '').trim() || 'https://via.placeholder.com/170x220'
          };
        }).filter(p => p.peserta !== '' && p.peserta !== '-');

        if (participants.length > 0) {
          updateCardContent();
        } else {
          document.getElementById('pesertaDisplay').innerText = 'Data Kosong!';
        }
      } catch (error) {
        console.error('Gagal memuat data Spreadsheet:', error);
        document.getElementById('pesertaDisplay').innerText = 'Gagal memuat koneksi!';
      }
    }

    function startEvent() {
      startScreen.classList.add('fade-out');
      setTimeout(() => {
        participantCard.classList.add('show');
      }, 3000);
    }

    function showOpening() {
      participantCard.classList.remove('show');
      setTimeout(() => {
        startScreen.classList.remove('fade-out');
      }, 500);
    }

    function updateCardContent() {
      if (participants.length === 0) return;
      document.getElementById('liqoDisplay').innerText = participants[currentIndex].liqo;
      document.getElementById('mudarissahDisplay').innerText = participants[currentIndex].mudarissah;
      document.getElementById('pesertaDisplay').innerText = participants[currentIndex].peserta;
      document.getElementById('photoDisplay').src = participants[currentIndex].photo;
    }

    function updateDisplay() {
      if (isTransitioning || participants.length === 0) return;
      isTransitioning = true;

      participantCard.classList.remove('show');

      setTimeout(() => {
        updateCardContent();
        participantCard.classList.add('show');

        setTimeout(() => {
          isTransitioning = false;
        }, 800);
      }, 800);
    }

    function nextParticipant() { 
      if (participants.length === 0) return;
      currentIndex = (currentIndex + 1) % participants.length; 
      updateDisplay(); 
    }

    function prevParticipant() { 
      if (participants.length === 0) return;
      currentIndex = (currentIndex - 1 + participants.length) % participants.length; 
      updateDisplay(); 
    }

    // Jalankan pengambilan data otomatis saat file HTML dibuka
    fetchSpreadsheetData();
  </script>

</body>
</html>
