<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pemanggilan Peserta Tasyakuran Dirosa IX</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-emerald: #041B12;
            --gold-light: #FFF0B3;
            --gold-main: #D4AF37;
            --gold-dark: #A1761B;
            --text-white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-emerald);
            color: var(--text-white);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .stage-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 50% 25%, rgba(212, 175, 55, 0.28) 0%, transparent 75%),
                              linear-gradient(135deg, rgba(4, 27, 18, 0.92) 0%, rgba(2, 12, 8, 0.98) 100%);
            z-index: 1;
        }

        .islamic-frame {
            position: absolute;
            inset: 15px;
            border: 2px solid rgba(212, 175, 55, 0.45);
            border-radius: 18px;
            pointer-events: none;
            z-index: 2;
            box-shadow: inset 0 0 35px rgba(212, 175, 55, 0.2);
        }

        .header-bar {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
        }

        .header-title {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #FFF6D0 0%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.85);
        }

        .stage-container {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 60px 60px 60px;
        }

        .card-container {
            display: flex;
            width: 100%;
            max-width: 1150px;
            height: 500px;
            background: rgba(3, 18, 12, 0.96);
            backdrop-filter: blur(15px);
            border: 2px solid var(--gold-main);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 40px rgba(212, 175, 55, 0.35);
            overflow: hidden;
            position: relative;
            transition: all 0.4s ease;
        }

        .photo-section {
            flex: 0 0 400px;
            background: #02120B;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-right: 2px solid rgba(212, 175, 55, 0.35);
        }

        .photo-frame {
            width: 290px;
            height: 370px;
            border-radius: 140px 140px 20px 20px;
            border: 4px solid var(--gold-main);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 25px rgba(212, 175, 55, 0.4);
            overflow: hidden;
            background: #062217;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .details-section {
            flex: 1;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .group-badge {
            display: inline-block;
            align-self: flex-start;
            padding: 6px 22px;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-main));
            color: #000;
            font-weight: 700;
            font-size: 14px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .participant-name {
            font-family: 'Cinzel', serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--gold-light);
            line-height: 1.25;
            margin-bottom: 22px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .meta-info {
            display: grid;
            grid-template-columns: 140px 1fr;
            row-gap: 12px;
            font-size: 18px;
            color: #E0EFE7;
        }

        .meta-label {
            font-weight: 600;
            color: var(--gold-main);
        }

        .mudarrisah-highlight {
            color: #FFF;
            font-weight: 700;
            background: rgba(212, 175, 55, 0.15);
            padding: 2px 10px;
            border-radius: 6px;
            border-left: 3px solid var(--gold-main);
        }

        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
            transition: width 0.05s linear;
        }

        .controls {
            position: absolute;
            bottom: 22px;
            right: 35px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.8);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .counter-badge {
            color: var(--gold-light);
            font-size: 13px;
            font-weight: 600;
            margin-right: 8px;
            border-right: 1px solid rgba(212, 175, 55, 0.3);
            padding-right: 12px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--gold-main);
            color: var(--gold-light);
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover {
            background: var(--gold-main);
            color: #000;
        }
    </style>
</head>

        let remainingTime = timerDuration;
        let timerInterval = null;
        let isPlaying = true;

        const pName = document.getElementById('pName');
        const pLiqo = document.getElementById('pLiqo');
        const pMudarrisah = document.getElementById('pMudarrisah');
        const pNo = document.getElementById('pNo');
        const pAlamat = document.getElementById('pAlamat');
        const pPhoto = document.getElementById('pPhoto');
        const timerBar = document.getElementById('timerBar');
        const playBtn = document.getElementById('playBtn');
        const pCounter = document.getElementById('pCounter');

        function getDefaultAvatar() {
            return "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='290' height='370' viewBox='0 0 290 370'><rect width='100%' height='100%' fill='%23062217'/><circle cx='145' cy='130' r='60' fill='%23D4AF37' opacity='0.35'/><path d='M 45 320 C 45 230, 245 230, 245 320 Z' fill='%23D4AF37' opacity='0.35'/></svg>";
        }

        function getPhotoUrl(name) {
            const fileId = GOOGLE_DRIVE_PHOTOS[name];
            if (fileId && fileId.length > 10 && !fileId.includes('PASTE_FILE_ID')) {
                return `https://lh3.googleusercontent.com/d/${fileId}`;
            }
            return getDefaultAvatar();
        }

        function handlePhotoError(img) {
            img.src = getDefaultAvatar();
        }

        function renderParticipant(index) {
            const data = participants[index];
            pName.innerText = data.name;
            pLiqo.innerText = data.liqo;
            pMudarrisah.innerText = data.mudarrisah;
            pNo.innerText = data.no;
            pAlamat.innerText = data.alamat;
            pPhoto.src = getPhotoUrl(data.name);
            pCounter.innerText = `${index + 1} / ${participants.length}`;

            resetTimer();
        }

        function resetTimer() {
            remainingTime = timerDuration;
            timerBar.style.width = '100%';
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPlaying) return;
                
                remainingTime -= 0.05;
                let pct = (remainingTime / timerDuration) * 100;
                timerBar.style.width = Math.max(0, pct) + '%';

                if (remainingTime <= 0) {
                    nextParticipant();
                }
            }, 50);
        }

        function nextParticipant() {
            currentIndex = (currentIndex + 1) % participants.length;
            renderParticipant(currentIndex);
        }

        function prevParticipant() {
            currentIndex = (currentIndex - 1 + participants.length) % participants.length;
            renderParticipant(currentIndex);
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            playBtn.innerText = isPlaying ? "Pause" : "Play";
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') togglePlay();
            if (e.code === 'ArrowRight') nextParticipant();
            if (e.code === 'ArrowLeft') prevParticipant();
        });

        renderParticipant(0);
        startTimer();
    </script>
